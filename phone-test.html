<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dirty Business Map, phone test</title>
<!--
  Phone layout test page (26 Nov 2026). It loads the live map (index.html) and
  lays the phone sheet over it, below 760 px only. Nothing here changes the
  live map; open this page on a phone to try the sheet.
-->
<script>
(function () {
    // Everything the phone sheet needs, written into the map page before it runs.
    var PHONE_CSS = `
@media (max-width:760px){
  :root{--ps-h:290px}
  /* the sheet: one surface along the bottom, moved only by swiping */
  body.ps #deck.ps-sheet, body.ps #sidebar.ps-sheet{
    position:fixed!important;left:0!important;right:0!important;bottom:0!important;top:auto!important;
    width:100%!important;max-width:none!important;height:var(--ps-h)!important;max-height:none!important;
    transform:none!important;opacity:1!important;border:0!important;border-top:.5px solid #2b2b2b!important;
    background:#fff!important;display:flex!important;flex-direction:column!important;flex-basis:auto!important;
    z-index:80!important;margin:0!important;transition:height .2s ease-out}
  body.ps.ps-drag #deck.ps-sheet, body.ps.ps-drag #sidebar.ps-sheet{transition:none!important}
  body.ps.ps-record #deck.ps-sheet{display:none!important}
  body.ps.ps-table #sidebar.ps-sheet{display:none!important}
  .ps-grab{height:22px;flex:0 0 22px;display:flex;align-items:center;justify-content:center;background:#fff;touch-action:none}
  .ps-grab i{display:block;width:40px;height:0;border-top:1px solid #2b2b2b}
  #status-strip,.status-strip,#scan-dot,#hover-card,#peek-card{display:none!important}

  /* toolbar: one column on the right; menu, search and key open as a window to its left */
  body.ps #bar{position:fixed!important;top:calc(env(safe-area-inset-top,0px) + 10px)!important;left:10px!important;right:10px!important;
    width:auto!important;max-height:none!important;display:flex!important;flex-direction:row-reverse!important;align-items:flex-start!important;
    gap:6px!important;overflow:visible!important;pointer-events:none!important}
  body.ps #bar .toolbar{flex-direction:column!important;width:auto!important;height:auto!important;padding:2px!important;gap:2px!important;
    overflow:visible!important;left:0!important;top:0!important}
  body.ps #bar .toolbar .lang{flex-direction:column!important;margin:0!important;position:static!important;gap:3px!important}
  body.ps #bar .drawer{flex:1 1 auto!important;width:auto!important;min-width:0!important;
    max-height:calc(100dvh - var(--ps-h) - 40px)!important}
  body.ps #bar:not(.open) .drawer{max-height:0!important}
  body.ps #bar .bar-scroll, body.ps #bar .pane, body.ps #bar .pad, body.ps #bar .in{width:auto!important;max-width:none!important}
  body.ps #bar .bar-scroll{max-height:calc(100dvh - var(--ps-h) - 40px)!important}
  /* finger-sized buttons */
  .toolbar .btn{width:36px!important;height:36px!important;flex:0 0 36px!important}
  .toolbar .btn.txt{width:36px!important}
  #btn-terrain,#btn-3d,#btn-light,#btn-flat,#btn-help,#btn-profile,#btn-select{display:none!important}
  .toolbar .btn.txt, .toolbar .lang .btn{font-size:12px!important}

  /* north arrow and zoom as on the desktop (the desktop rules of the saved look), above the sheet */
  #map .maplibregl-ctrl-bottom-left, #map .maplibregl-ctrl-bottom-right{bottom:calc(var(--ps-h) + 8px)!important;transition:bottom .2s ease-out}
  body.ps-drag #map .maplibregl-ctrl-bottom-left, body.ps-drag #map .maplibregl-ctrl-bottom-right{transition:none!important}
  #map .maplibregl-ctrl-bottom-left{left:auto!important;right:0!important;margin:0 10px 0 0!important;display:flex!important;flex-direction:column!important;align-items:flex-end!important}
  #map .maplibregl-ctrl-bottom-left .maplibregl-ctrl-scale{display:none!important}
  #map .maplibregl-ctrl-bottom-right{right:auto!important;left:0!important;margin:0 0 0 10px!important}
  #compass{background:transparent!important;border:0!important;box-shadow:none!important;
  position:relative!important;left:0!important;top:0!important;right:auto!important;bottom:auto!important;width:35px!important;max-width:none!important;height:63px!important;max-height:none!important;font-family:"PlexMono",sans-serif!important}
  #map span.maplibregl-ctrl-icon{height:10px!important;max-height:none!important;position:relative!important;left:0!important;top:0!important;font-weight:100!important;font-family:"Verdana",sans-serif!important;background-color:#ff000000!important}
  #map .maplibregl-ctrl-bottom-left .maplibregl-ctrl-group{display:none!important}
  body.ps-noctl #map .maplibregl-ctrl-bottom-left, body.ps-noctl #map .maplibregl-ctrl-bottom-right{display:none!important}

  /* the table */
  #deck .deck-head{flex:0 0 auto!important;height:auto!important;max-height:none!important;overflow:visible!important;
    position:relative!important;z-index:3!important;padding:0 8px!important}
  #tabstrip{display:flex!important;flex-wrap:nowrap!important;overflow-x:auto!important;scrollbar-width:none!important;
    width:100%!important;height:33px!important;min-height:33px!important;align-items:flex-end!important;margin:0!important}
  #tabstrip .tab{position:relative!important;flex:0 0 auto!important;max-width:none!important;width:auto!important;min-width:0!important;
    overflow:visible!important;white-space:nowrap!important;padding:5px 20px 0 18px!important;height:32px!important;
    display:flex!important;align-items:center!important;gap:6px!important;line-height:1!important;box-sizing:border-box!important}
  #tabstrip .tab span{position:relative!important;z-index:1!important;font-family:Plex,Helvetica,Arial,sans-serif!important;
    font-weight:700!important;font-size:12.5px!important;letter-spacing:.02em!important}
  #tabstrip .tab > svg{position:absolute!important;left:0!important;top:0!important;width:100%!important;height:100%!important;z-index:0!important}
  #deck .deck-scroll{flex:1 1 auto!important;overflow:auto!important;height:auto!important;max-height:none!important;display:block!important}
  #deck-size{display:none!important}
  #deck table{table-layout:fixed!important}
  #site-table .c-op,#site-table .c-mat,#site-table .c-plan,#site-table .c-cap,#site-table .c-uid,#site-table .c-kom,#site-table .c-area{display:table-cell!important}
  #deck tbody td{white-space:nowrap!important}
  #deck tbody td:first-child{white-space:normal!important}
  #deck tr > :first-child{position:sticky!important;left:0!important;background:#fff!important;z-index:2!important;box-shadow:.5px 0 0 #d8d8d8}
  #deck tbody td{height:44px!important}
  #deck td.num,#deck th.num{white-space:nowrap!important}

  /* the record: no header row, a small photo beside the name, no lines between parts */
  #sidebar .sb-header{display:none!important}
  #sidebar .sb-scroll-area{flex:1 1 auto!important;overflow:auto!important;height:auto!important;max-height:none!important;width:auto!important;
    position:relative!important;left:0!important;top:0!important}
  #sidebar .sb-media,#sidebar .sb-credit{display:none!important}
  #sidebar .sb-scroll-area{overflow-x:hidden!important}
  #sidebar #sb-dynamic-content, #sidebar #sb-dynamic-content *{max-width:100%!important;box-sizing:border-box}
  #sb-dynamic-content div.graph-head{width:auto!important;left:0!important}
  #sb-dynamic-content{padding-left:14px!important;padding-right:14px!important;width:auto!important}
  #ps-top{display:flex;gap:12px;align-items:flex-start;padding:0 12px 0 0}
  #ps-top .sb-head{flex:1 1 auto;min-width:0}
  #deck .deck-head{touch-action:pan-x}
  #ps-thumb{flex:0 0 76px;width:76px;height:76px;object-fit:cover;border:.5px solid #2b2b2b;margin-top:10px;display:block}
  #sidebar .sb-scroll-area *{border-top-width:0!important;border-bottom-width:0!important}
  #sidebar hr{display:none!important}
  body.ps #sidebar #sb-dynamic-content span.status-badge{width:auto!important;max-width:100%!important;height:auto!important;border-style:none!important;
    display:flex!important;flex-wrap:wrap!important;align-items:center!important;letter-spacing:.04em!important;font-size:12px!important;line-height:1.4!important}
  #ps-thumb{cursor:pointer}
  #ps-view{position:fixed;inset:0;z-index:200;background:#fff;overflow-y:auto;display:none;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 24px}
  #ps-view.on{display:block}
  #ps-view img{display:block;width:100%;height:auto;margin:0 0 6px}
  #ps-view .cr{font-size:11px;color:#666;margin:0 0 18px}
  #ps-view .x{position:sticky;top:0;float:right;width:36px;height:36px;background:#fff;border:.5px solid #2b2b2b;font-size:18px;line-height:34px;text-align:center}
  #sb-dynamic-content div.sb-desc, #sb-dynamic-content div.sb-location{height:auto!important}
}
@media (max-width:760px) and (prefers-reduced-motion:reduce){
  body.ps #deck.ps-sheet, body.ps #sidebar.ps-sheet, #map .maplibregl-ctrl-bottom-left, #map .maplibregl-ctrl-bottom-right{transition:none!important}
}`;

    function PHONE_JS() {
        var MQ = window.matchMedia('(max-width:760px)');
        var $ = function (id) { return document.getElementById(id); };
        var body = document.body;
        var mode = 'table', stop = 'mid';

        function heights() {
            var H = window.innerHeight;
            return { low: 64, mid: Math.round(H * 0.34), full: H - 100 };
        }
        function apply() {
            var h = heights()[stop];
            document.documentElement.style.setProperty('--ps-h', h + 'px');
            body.classList.toggle('ps-record', mode === 'record');
            body.classList.toggle('ps-table', mode === 'table');
            room(h);
            setTimeout(recentre, 230);
        }
        function room(h) {
            var bar = document.querySelector('#bar .toolbar') || $('bar');
            var tb = bar ? bar.getBoundingClientRect().bottom : 100;
            body.classList.toggle('ps-noctl', window.innerHeight - h - 8 - 80 < tb + 8);
        }
        var target = null, framed = '';
        function recentre() {
            var M = window.__M; if (!M || mode !== 'record') return;
            var h = heights()[stop];
            var pad = { top: 110, bottom: h + 24, left: 30, right: 30 };
            var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
            var b = window.__pad && window.__pad().box;
            if (b && framed !== b.join()) {
                framed = b.join(); target = null;
                M.fitBounds([[b[0], b[1]], [b[2], b[3]]], { padding: pad, maxZoom: 17, duration: still ? 0 : 900 });
            } else if (target) {
                var t = target; target = null;
                M.flyTo({ center: t, zoom: Math.max(M.getZoom(), 14), padding: pad, duration: still ? 0 : 900 });
            } else M.easeTo({ padding: pad, duration: 200 });
        }
        function watchTaps() {
            var M = window.__M; if (!M) { setTimeout(watchTaps, 300); return; }
            M.on('click', function (e) {
                var f = M.queryRenderedFeatures(e.point).filter(function (x) { return x.geometry && x.geometry.type === 'Point'; })[0];
                target = f ? f.geometry.coordinates : [e.lngLat.lng, e.lngLat.lat];
                setTimeout(function () { if (mode !== 'record') target = null; }, 1500);
            });
        }

        // a grab line on top of both sheets
        function addGrab(el) {
            if (!el || el.querySelector(':scope > .ps-grab')) return;
            var g = document.createElement('div'); g.className = 'ps-grab'; g.innerHTML = '<i></i>';
            el.insertBefore(g, el.firstChild);
            dragOn(g, true);
        }

        // swipe: up = next height, down = previous; down from a record = back to the table.
        // sticky: always drags; otherwise only once the finger has gone 14 px up or down
        // (and, on a scrolled list, only when the list is at its top and the finger goes down).
        function dragOn(el, always, list) {
            var y0 = null, yl = 0, h0 = 0, moved = false, ok = false;
            function startAt(y) { y0 = y; yl = y; h0 = heights()[stop]; moved = false; ok = true; }
            function moveTo(y, ev) {
                if (y0 === null) return;
                yl = y; var dy = y - y0;
                if (!moved) {
                    if (Math.abs(dy) < (always ? 6 : 14)) return;
                    if (list && (list.scrollTop > 0 || dy < 0)) { y0 = null; return; }
                    moved = true; body.classList.add('ps-drag');
                }
                var h = Math.max(48, Math.min(window.innerHeight - 80, h0 - dy));
                document.documentElement.style.setProperty('--ps-h', h + 'px');
                room(h);
                if (ev.cancelable) ev.preventDefault();
            }
            function endNow() {
                if (y0 === null) return;
                var dy = yl - y0; y0 = null;
                body.classList.remove('ps-drag');
                if (!moved) {
                    // a tap on the grab line of a record: back to the table
                    if (always && mode === 'record') closeRecord();
                    return;
                }
                if (dy < -40) up(); else if (dy > 40) down(); else apply();
                var stopClick = function (ev) { ev.stopPropagation(); ev.preventDefault(); };
                window.addEventListener('click', stopClick, true);
                setTimeout(function () { window.removeEventListener('click', stopClick, true); }, 350);
            }
            el.addEventListener('touchstart', function (e) { startAt(e.touches[0].clientY); }, { passive: true });
            el.addEventListener('touchmove', function (e) { moveTo(e.touches[0].clientY, e); }, { passive: false });
            el.addEventListener('touchend', endNow);
            el.addEventListener('touchcancel', endNow);
            el.addEventListener('mousedown', function (e) { startAt(e.clientY); });
            window.addEventListener('mousemove', function (e) { if (y0 !== null) moveTo(e.clientY, e); });
            window.addEventListener('mouseup', endNow);
        }
        function up() { stop = stop === 'low' ? 'mid' : 'full'; apply(); }
        function down() {
            if (stop === 'full') stop = 'mid';
            else if (mode === 'record') { closeRecord(); return; }
            else stop = 'low';
            apply();
        }
        function closeRecord() {
            var c = $('sb-close'); if (c) c.click();
            mode = 'table'; stop = 'mid'; apply();
        }

        // the table: one column for the name, one for the figure (the capacity bars go)
        function fixTable() { var deck = $('deck'); if (deck) raise(deck); }
        // the folder tabs stretched round the bigger names
        function fixTabs() {
            document.querySelectorAll('#tabstrip .tab > svg').forEach(function (v) {
                v.setAttribute('preserveAspectRatio', 'none'); v.removeAttribute('height'); v.setAttribute('width', '100%');
                var vb = (v.getAttribute('viewBox') || '0 0 175 45').split(' ').map(Number);
                v.querySelectorAll('polygon,polyline').forEach(function (p) {
                    var pts = p.getAttribute('points').trim().split(/\s+/).map(function (q) { return q.split(',').map(Number); });
                    var ys = pts.map(function (q) { return q[1]; });
                    var a = Math.min.apply(null, ys), b = Math.max.apply(null, ys);
                    if (a <= 1.05 && b >= vb[3] - 1.5) return;
                    var k = (vb[3] - 1) / ((b - a) || 1);
                    p.setAttribute('points', pts.map(function (q) { return q[0] + ',' + (1 + (q[1] - a) * k).toFixed(1); }).join(' '));
                });
            });
        }
        // nothing under 13 px (12 px for the monospace)
        function raise(root) {
            var mono = /mono|cutive|courier/i;
            root.querySelectorAll('*').forEach(function (e) {
                if (e.closest('#tabstrip')) return;
                var txt = false;
                for (var n = e.firstChild; n; n = n.nextSibling) if (n.nodeType === 3 && n.textContent.trim()) { txt = true; break; }
                if (!txt) return;
                var cs = getComputedStyle(e), fs = parseFloat(cs.fontSize), min = mono.test(cs.fontFamily) ? 12 : 13;
                if (fs < min) e.style.setProperty('font-size', min + 'px', 'important');
            });
        }
        // the record: the photo as a small square beside the name
        function fixRecord() {
            var sb = $('sidebar'); if (!sb) return;
            var head = sb.querySelector('.sb-head'), media = sb.querySelector('.sb-media');
            if (head && media && !head.closest('#ps-top')) {
                var top = document.createElement('div'); top.id = 'ps-top';
                head.parentElement.insertBefore(top, head); top.appendChild(head);
                var u = null;
                media.querySelectorAll('*').forEach(function (e) {
                    if (u) return;
                    var s = e.currentSrc || e.src; if (s) { u = s; return; }
                    var m = /url\("?(.*?)"?\)/.exec(getComputedStyle(e).backgroundImage); if (m) u = m[1];
                });
                var t = null;
                if (u) { t = document.createElement('img'); t.id = 'ps-thumb'; t.src = u; t.alt = ''; top.appendChild(t); }
                if (t) t.addEventListener('click', function (e) { e.stopPropagation(); viewPhotos(media); });
            }
            raise(sb);
        }
        // the photos of the record, whole, one under the other; a tap closes
        function viewPhotos(media) {
            var v = $('ps-view');
            if (!v) { v = document.createElement('div'); v.id = 'ps-view'; body.appendChild(v); v.addEventListener('click', function () { v.classList.remove('on'); }); }
            var seen = {}, html = '<div class="x">\u00d7</div>';
            media.querySelectorAll('img, [style*="background-image"]').forEach(function (e) {
                var u = e.currentSrc || e.src;
                if (!u) { var m = /url\("?(.*?)"?\)/.exec(getComputedStyle(e).backgroundImage); if (m) u = m[1]; }
                if (!u || seen[u]) return; seen[u] = 1;
                html += '<img src="' + u.replace(/"/g, '&quot;') + '" alt="">';
            });
            var cr = $('sidebar').querySelector('.sb-credit');
            if (cr && cr.textContent.trim()) html += '<p class="cr">' + cr.innerHTML + '</p>';
            v.innerHTML = html; v.classList.add('on'); v.scrollTop = 0;
        }
        function fixToolbar() {
            document.querySelectorAll('.toolbar > *').forEach(function (e) {
                if (e.tagName !== 'BUTTON' && !e.querySelector('button') && e.getBoundingClientRect().width < 12) e.style.setProperty('display', 'none', 'important');
            });
        }

        function start() {
            if (!MQ.matches || !$('deck') || !$('sidebar')) return false;
            body.classList.add('ps');
            $('deck').classList.add('ps-sheet'); $('sidebar').classList.add('ps-sheet');
            addGrab($('deck')); addGrab($('sidebar'));
            var sa = $('sidebar').querySelector('.sb-scroll-area'); if (sa) dragOn(sa, false, sa);
            var ds = document.querySelector('#deck .deck-scroll'); if (ds) dragOn(ds, false, ds);
            var dh = document.querySelector('#deck .deck-head'); if (dh) dragOn(dh, false);
            fixToolbar();
            document.querySelectorAll('#bar .toolbar .btn').forEach(function (b) { b.addEventListener('click', function () { setTimeout(function () { raise($('bar')); room(heights()[stop]); }, 120); }); });
            // the table shows from the start
            var on = document.querySelector('#tabstrip .tab[aria-selected="true"]') || $('tab-facility');
            if ($('deck').className.indexOf('closed') >= 0 || !$('deck').querySelector('tbody tr')) { if (on) on.click(); }
            // a picked site opens its record in the sheet at once (no label in between)
            var peek = $('peek-card');
            if (peek) new MutationObserver(function () {
                if (!peek.hidden && $('peek-open')) $('peek-open').click();
            }).observe(peek, { attributes: true, attributeFilter: ['hidden'] });
            new MutationObserver(function () {
                var open = $('sidebar').classList.contains('active');
                if (open && mode !== 'record') { mode = 'record'; stop = 'mid'; apply(); }
                if (!open && mode === 'record') { mode = 'table'; stop = 'mid'; framed = ''; apply(); }
                if (open && mode === 'record' && window.__pad && window.__pad().box && framed !== window.__pad().box.join()) { setTimeout(recentre, 260); setTimeout(function () { framed = ''; recentre(); }, 1300); }
                if (open) fixRecord();
            }).observe($('sidebar'), { attributes: true, attributeFilter: ['class'], childList: true, subtree: true });
            var busy = false;
            new MutationObserver(function () {
                if (busy) return; busy = true;
                requestAnimationFrame(function () { fixTabs(); fixTable(); busy = false; });
            }).observe($('deck'), { childList: true, subtree: true });
            fixTabs(); fixTable(); apply(); watchTaps();
            window.addEventListener('resize', function () { apply(); });
            return true;
        }
        var tries = 0;
        (function wait() { if (!start() && tries++ < 60) setTimeout(wait, 250); })();
    }

    fetch('index.html?x=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
        t = t.replace("if (new URLSearchParams(window.location.search).has('debug')) window.__M = map;", 'window.__M = map;');
        t = t.replace('return all.filter(c => !(phone() && c.nophone))', 'return all.filter(c => !(false && c.nophone))');
        t = t.replace("if (phone()) { if (c.pw) col.style.width = c.pw + 'px'; }", "if (phone()) { col.style.width = (c.key === 'Name' ? 190 : Math.round(c.w * 0.7)) + 'px'; }");
        t = t.replace("table.style.width = phone() ? '100%'", "table.style.width = phone() ? cols.reduce(function (a, c) { return a + (c.key === 'Name' ? 190 : Math.round(c.w * 0.7)); }, 0) + 'px'");
        t = t.replace('</head>', '<style id="phone-sheet">' + PHONE_CSS + '</style>\n</head>');
        t = t.replace(/<\/body>(?![\s\S]*<\/body>)/, '<script>(' + PHONE_JS.toString() + ')();<\/script>\n</body>');
        document.open(); document.write(t); document.close();
    });
})();
</script>
</head>
<body></body>
</html>
