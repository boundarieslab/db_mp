<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Jølsen Miljøpark - Ownership Network</title>
    
    <style>
        /* Same typeface as dirtybusiness.no and the map, served from the same
           place, so the graphs are typographically part of the site. */
        @font-face {
            font-family: 'Diatype Mono';
            src: url('https://freight.cargo.site/t/original/i/34e062220d932607590d93991273932252277d33d93566736279930922253303/DiatypeMono-Regular.woff2') format('woff2');
            font-weight: normal; font-display: swap;
        }
        @font-face {
            font-family: 'Diatype Mono';
            src: url('https://freight.cargo.site/t/original/i/2274439092002939333902999233829283733003002928833773300022200299/DiatypeMono-Bold.woff2') format('woff2');
            font-weight: bold; font-display: swap;
        }
    </style>
    <style>
        /* Identical frame for every graph: legend on top, graph fills the rest. */
        .node-group, .link-line { transition: opacity 0.4s ease, stroke 0.4s ease; }
        .dimmed { opacity: 0.15 !important; }
        .highlight-link { stroke: #000 !important; stroke-width: 0.9 !important; opacity: 1 !important; }

        svg { user-select: none; -webkit-user-select: none; }
    
        /* ── Canonical frame: identical in every graph in this repo ───────── */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
                     background: #fff; display: flex; flex-direction: column;
                     font-family: 'Diatype Mono', 'JetBrains Mono', 'Courier New', monospace; }
        /* The tree, and under it the legend: one thin line, only the symbols used. */
        #single-line-legend {
            order: 2; flex: 0 0 auto; width: 100%;
            display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start;
            gap: 4px 14px; padding: 6px 14px 7px; box-sizing: border-box;
            background: #fff;
            font-size: 7px; color: #777; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .legend-item { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
        .legend-item svg { width: 8px !important; height: 8px !important; flex-shrink: 0; overflow: visible; }
        .legend-section, .legend-divider { display: none; }
        #network-container { order: 1; flex: 1 1 auto; width: 100%; min-height: 0;
                             position: relative; margin: 0; overflow-y: auto; overflow-x: hidden; }
        #network-container::-webkit-scrollbar { width: 4px; } #network-container::-webkit-scrollbar-thumb { background: #ccc; }
        #network-container svg { width: 100%; display: block; }
        /* a name that is a site on the map: a link to it */
        .site-link { cursor: pointer; }
        .site-link .ul { stroke: #000; stroke-width: 0.5; }
        .site-link:hover text { fill: #000 !important; }
</style>
</head>
<body>

<div id="single-line-legend">
    <div class="legend-item"><svg viewBox="0 0 14 14"><rect x="1" y="1" width="12" height="12" fill="#000"/></svg> Parent group</div>
    <div class="legend-item"><svg viewBox="0 0 14 14"><polygon points="7,1 13,13 1,13" fill="#666"/></svg> Division</div>
    <div class="legend-item"><svg viewBox="0 0 14 14"><polygon points="7,1 13,13 1,13" fill="none" stroke="#666" stroke-width="1.5"/></svg> Subsidiary</div>
    <div class="legend-item"><svg viewBox="0 0 14 14"><rect x="1" y="1" width="12" height="12" fill="none" stroke="#666" stroke-width="1.5"/></svg> Affiliated site</div>
    <div class="legend-item"><svg viewBox="0 0 14 14"><rect x="1" y="1" width="12" height="12" fill="none" stroke="#00FF00" stroke-width="1.5"/><line x1="1" y1="1" x2="13" y2="13" stroke="#00FF00" stroke-width="1.5"/></svg> Construction project</div>
    <div class="legend-item"><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="none" stroke="#FF0000" stroke-width="1.5"/><path d="M1,7 A6,6 0 0,0 13,7 Z" fill="#000"/></svg> Facility</div>
</div>

<div id="network-container"></div>

<script>
(function(){
    var containerID = "network-container"; 

    var NODES = [
        {id:"AF Gruppen ASA", type:"p"},
        {id:"AF Gruppen Norge AS", type:"div_ent"},
        {id:"AF Energi og Miljø AS", type:"div_ent"},
        {id:"AF Offshore AS", type:"div_ent"},
        {id:"AF Decom AS", type:"div_ent"},
        {id:"Nes Miljøpark AS", type:"div_ent"},
        {id:"Mepex AS", type:"div_ent", l:"(Consulting)"},
        {id:"AF Energi AS", type:"div_ent"},
        {id:"Jølsen Eiendom 1 AS", type:"div_ent"},
        {id:"Jølsen Eiendom 4 AS", type:"div_ent"},
        {id:"Betonmast AS", type:"div_ent", l:"(Construction)"},
        {id:"Strøm Gundersen AS", type:"div_ent"},
        {id:"AF Offshore Decom AS", type:"div_ent"},
        {id:"AF Miljøbase Vats AS", type:"div_ent"},
        {id:"Jølsen Miljøpark", type:"receiving", active:true},
        {id:"Jølsen Miljøpark AS", type:"div_ent"},
        {id:"Betonmast Holding AS", type:"div_ent"},
        {id:"AF Gruppen Holding AS", type:"div_ent"},
        {id:"Esval Miljøpark Nes KF", type:"p"},
        {id:"Gunnar Holth Grusforretning AS", type:"div_ent"},
        {id:"Constructio AS", type:"p"}
    ];
    
    var LINKS = [
        ["AF Decom AS", "AF Energi og Miljø AS"],
        ["Jølsen Eiendom 1 AS", "Jølsen Miljøpark AS"],
        ["Jølsen Eiendom 4 AS", "Jølsen Miljøpark AS"],
        ["Mepex AS", "AF Energi og Miljø AS"],
        ["AF Energi AS", "AF Energi og Miljø AS"],
        ["AF Offshore Decom AS", "AF Offshore AS"],
        ["Jølsen Miljøpark", "Jølsen Miljøpark AS"],
        ["Jølsen Miljøpark AS", "AF Decom AS"],
        ["AF Energi og Miljø AS", "AF Gruppen ASA"],
        ["AF Offshore AS", "AF Gruppen ASA"],
        ["AF Miljøbase Vats AS", "AF Offshore AS"],
        ["AF Gruppen Norge AS", "AF Gruppen ASA"],
        ["Betonmast AS", "Betonmast Holding AS"],
        ["Betonmast Holding AS", "AF Gruppen ASA"],
        ["Strøm Gundersen AS", "AF Gruppen Holding AS"],
        ["AF Gruppen Holding AS", "AF Gruppen ASA"],
        ["Nes Miljøpark AS", "Esval Miljøpark Nes KF"],
        ["Nes Miljøpark AS", "Gunnar Holth Grusforretning AS"],
        ["Nes Miljøpark AS", "AF Energi og Miljø AS"],
        ["Gunnar Holth Grusforretning AS", "Constructio AS"]
    ];

    // ── Shared node vocabulary ────────────────────────────────────────────
    // One shape set for every graph in this repo. Colours are the site's:
    // black, grey, --col-facility #FF0000 (reception), --col-project #00FF00 (construction).
    var DB_BLACK = "#000", DB_GREY = "#666", DB_RECEPTION = "#FF0000", DB_PROJECT = "#00FF00";

    function dbShape(node) {
        var ns = "http://www.w3.org/2000/svg";
        // Read whichever key the data uses. Files written at different times
        // stored the type under cargo_type: or t:, and reading only .type made
        // every node in them fall through to the default shape.
        var type = (node && (node.type || node.cargo_type || node.t)) || "s";
        var g = document.createElementNS(ns, "g");
        var r = 3.5, p = 2;

        function halo(kind) {
            var e;
            if (kind === "tri") {
                e = document.createElementNS(ns, "polygon");
                e.setAttribute("points", "0,-" + (r+1+p) + " " + (r+1+p) + "," + (r+1+p) + " -" + (r+1+p) + "," + (r+1+p));
            } else if (kind === "circle") {
                e = document.createElementNS(ns, "circle");
                e.setAttribute("r", r + p);
            } else {
                e = document.createElementNS(ns, "rect");
                e.setAttribute("x", -(r+p)); e.setAttribute("y", -(r+p));
                e.setAttribute("width", (r+p)*2); e.setAttribute("height", (r+p)*2);
            }
            e.setAttribute("fill", "#fff");
            g.appendChild(e);
            return e;
        }
        function sq(fill, stroke) {
            var e = document.createElementNS(ns, "rect");
            e.setAttribute("x", -r); e.setAttribute("y", -r);
            e.setAttribute("width", r*2); e.setAttribute("height", r*2);
            e.setAttribute("fill", fill);
            if (stroke) { e.setAttribute("stroke", stroke); e.setAttribute("stroke-width", "1"); }
            g.appendChild(e);
        }
        function tri(fill, stroke) {
            var e = document.createElementNS(ns, "polygon");
            e.setAttribute("points", "0,-" + (r+1) + " " + (r+1) + "," + (r+1) + " -" + (r+1) + "," + (r+1));
            e.setAttribute("fill", fill);
            if (stroke) { e.setAttribute("stroke", stroke); e.setAttribute("stroke-width", "1"); }
            g.appendChild(e);
        }
        function halfCircle(ring) {
            var c = document.createElementNS(ns, "circle");
            c.setAttribute("r", r); c.setAttribute("fill", "none");
            c.setAttribute("stroke", ring); c.setAttribute("stroke-width", "1");
            var pa = document.createElementNS(ns, "path");
            pa.setAttribute("fill", DB_BLACK);
            pa.setAttribute("d", "M -" + r + " 0 A " + r + " " + r + " 0 0 0 " + r + " 0 Z");
            g.appendChild(c); g.appendChild(pa);
        }

        if (type === "p" || type === "parent") {            // PARENT GROUP
            halo("sq"); sq(DB_BLACK, null);
        } else if (type === "div_ind" || type === "div" || type === "division") {  // DIVISION
            halo("tri"); tri(DB_GREY, null);
        } else if (type === "div_ent" || type === "subsidiary") {  // SUBSIDIARY
            halo("tri"); tri("none", DB_GREY);
        } else if (type === "construction" || type === "cp") {     // CONSTRUCTION PROJECT
            halo("sq"); sq("none", DB_PROJECT);
            var d = document.createElementNS(ns, "line");
            d.setAttribute("x1", -r); d.setAttribute("y1", -r);
            d.setAttribute("x2", r);  d.setAttribute("y2", r);
            d.setAttribute("stroke", DB_PROJECT); d.setAttribute("stroke-width", "1");
            g.appendChild(d);
        } else if (type === "receiving" || type === "f" || type === "facility") {  // FACILITY
            halo("circle"); halfCircle(DB_RECEPTION);
        } else {                                            // AFFILIATED SITE
            halo("sq"); sq("none", DB_GREY);
        }

        // "this facility": bigger than the rest, with the bold black label the
        // renderer already gives it. The dashed ring it used to wear read as a
        // sixth symbol in a legend that only has five.
        if (node && node.active) g.setAttribute("transform", "scale(1.25)");
        return g;
    }

    // ── Tree layout ──────────────────────────────────────────────────────
    // Owners at the top, each company indented under the company that owns
    // it, one per line, joined by thin elbow lines. Every name is written in
    // full on its own line, so nothing can overlap however many companies a
    // graph holds, and the picture is the same every time it opens.
    // A company with more than one owner sits under its main owner (the last
    // one listed); under each other owner it appears again as a grey
    // cross-reference row marked with ↗.
    var ROW = 16, INDENT = 16, TOP = 14, LEFT = 14, GAP = 9;
    var el = document.getElementById(containerID), svg, rows = [], byId = {};
    var ns = "http://www.w3.org/2000/svg", CHAIN = [];

    function build() {
        var parents = {}, kids = {};
        NODES.forEach(function (n) { byId[n.id] = n; parents[n.id] = []; kids[n.id] = []; });
        LINKS.forEach(function (l) { if (byId[l[0]] && byId[l[1]]) parents[l[0]].push(l[1]); });
        var main = {};
        Object.keys(parents).forEach(function (c) {
            var p = parents[c]; if (!p.length) return;
            main[c] = p[p.length - 1];
            p.forEach(function (q) { kids[q].push({ id: c, ref: q !== main[c] }); });
        });
        // the chain from the site up to its top owner, to order things by
        var active = NODES.find(function (n) { return n.active; }) || NODES[0];
        var chain = [], cur = active.id, guard = 0;
        while (cur && guard++ < 50) { chain.push(cur); cur = main[cur]; }
        var onChain = function (id) { return chain.indexOf(id) >= 0; };
        // does this subtree contain the site?
        var holds = {};
        function h(id, seen) {
            if (holds[id] !== undefined) return holds[id];
            if (seen[id]) return false; seen[id] = 1;
            var r = id === active.id || kids[id].some(function (k) { return !k.ref && h(k.id, seen); });
            return (holds[id] = r);
        }
        NODES.forEach(function (n) { h(n.id, {}); });
        function order(list) {
            return list.slice().sort(function (a, b) {
                var ha = holds[a.id] && !a.ref ? 0 : 1, hb = holds[b.id] && !b.ref ? 0 : 1;
                if (ha !== hb) return ha - hb;               // the site's branch first
                var ka = kids[a.id].length && !a.ref ? 0 : 1, kb = kids[b.id].length && !b.ref ? 0 : 1;
                if (ka !== kb) return ka - kb;               // then companies that own others
                if (a.ref !== b.ref) return a.ref ? 1 : -1;  // cross-references last
                return a.id.localeCompare(b.id, "nb");
            });
        }
        var roots = order(NODES.filter(function (n) { return !parents[n.id].length; })
                               .map(function (n) { return { id: n.id, ref: false }; }));
        CHAIN = chain;
        rows = [];
        function walk(item, depth, parentRow, seen) {
            var r = { id: item.id, ref: item.ref, depth: depth, parent: parentRow, node: byId[item.id] };
            rows.push(r);
            if (item.ref || seen[item.id]) return;
            seen[item.id] = 1;
            order(kids[item.id]).forEach(function (k) { walk(k, depth + 1, r, seen); });
        }
        var seen = {};
        roots.forEach(function (r) { walk(r, 0, null, seen); });
    }

    function label(n, ref) {
        var t = n.id + (n.l && !ref ? " " + n.l : "");
        return ref ? t + "  ↗" : t;
    }

    function draw() {
        var W = el.offsetWidth || 400;
        el.innerHTML = "";
        svg = document.createElementNS(ns, "svg");
        el.appendChild(svg);
        var lineG = document.createElementNS(ns, "g"), nodeG = document.createElementNS(ns, "g");
        svg.appendChild(lineG); svg.appendChild(nodeG);
        var y = TOP;
        rows.forEach(function (r) {
            r.linked = false;
            r.x = LEFT + r.depth * INDENT;
            // a name too long for the width wraps under itself, never cut
            var maxCh = Math.max(14, Math.floor((W - r.x - GAP - 8) / 5.45));
            var words = label(r.node, r.ref).split(" "), lines = [], cur = "";
            words.forEach(function (w) {
                var t = cur ? cur + " " + w : w;
                if (t.length <= maxCh || !cur) cur = t; else { lines.push(cur); cur = w; }
            });
            if (cur) lines.push(cur);
            r.lines = lines; r.y = y; y += ROW + (lines.length - 1) * 10;
        });
        var H = y + TOP - ROW / 2;
        svg.setAttribute("viewBox", "0 0 " + W + " " + H);
        svg.setAttribute("width", W); svg.setAttribute("height", H);
        svg.style.height = H + "px";

        rows.forEach(function (r) {
            if (r.parent) {
                var p = document.createElementNS(ns, "path");
                p.setAttribute("d", "M" + r.parent.x + "," + (r.parent.y + 5) + " V" + r.y + " H" + (r.x - 6));
                p.setAttribute("fill", "none");
                // the site's own line of owners is drawn in black, the rest in grey
                var own = !r.ref && CHAIN.indexOf(r.id) >= 0 && CHAIN.indexOf(r.parent.id) >= 0;
                p.setAttribute("stroke", own ? "#000" : (r.ref ? "#bbb" : "#c8c8c8"));
                p.setAttribute("stroke-width", own ? "0.9" : "0.75");
                if (r.ref) p.setAttribute("stroke-dasharray", "2 2");
                p.setAttribute("class", "link-line");
                r.lineEl = p;
                if (own) lineG.appendChild(p); else lineG.insertBefore(p, lineG.firstChild);  // black on top
            }
            var g = document.createElementNS(ns, "g");
            g.setAttribute("class", "node-group");
            g.setAttribute("transform", "translate(" + r.x + "," + r.y + ")");
            var shape = dbShape(r.node);
            if (r.ref) shape.setAttribute("opacity", "0.45");
            g.appendChild(shape);
            var txt = document.createElementNS(ns, "text");
            txt.setAttribute("x", GAP); txt.setAttribute("y", 3);
            var inChain = !r.ref && CHAIN.indexOf(r.id) >= 0;
            txt.setAttribute("fill", inChain ? "#000" : (r.ref ? "#9a9a9a" : "#555"));
            txt.style.font = (r.node.active && !r.ref ? "600 10px" : "400 9px") + " 'Diatype Mono', 'Courier New', monospace";
            r.lines.forEach(function (ln, i) {
                var ts = document.createElementNS(ns, "tspan");
                ts.textContent = ln; ts.setAttribute("x", GAP); ts.setAttribute("dy", i ? 10 : 0);
                txt.appendChild(ts);
            });
            var tip = document.createElementNS(ns, "title"); tip.textContent = label(r.node, false); txt.appendChild(tip);
            g.appendChild(txt);
            r.el = g; r.tEl = txt;
            g.onmouseenter = function () { focus(r.id); };
            g.onmouseleave = function () { focus(null); };
            nodeG.appendChild(g);
        });
        markLinks();
        try { parent.postMessage({ dbGraphReady: 1 }, "*"); } catch (e) {}
        // tell the page that holds this graph how tall it is
        var lg = document.getElementById("single-line-legend");
        var full = H + (lg ? lg.offsetHeight : 0);
        try { parent.postMessage({ dbGraphHeight: Math.ceil(full) }, "*"); } catch (e) {}
    }

    // Names that are sites on the map become links. The page holding the graph
    // sends {dbLinkable: {name: UID}}; a click sends {dbOpenSite: UID} back.
    var LINKABLE = {};
    function markLinks() {
        rows.forEach(function (r) {
            var uid = LINKABLE[r.id];
            if (!uid || !r.el || r.node.active || r.ref || r.linked) return;
            r.linked = true;
            r.el.classList.add("site-link");
            var bb = r.tEl.getBBox(), ul = document.createElementNS(ns, "line");
            ul.setAttribute("class", "ul");
            ul.setAttribute("x1", bb.x); ul.setAttribute("x2", bb.x + bb.width);
            ul.setAttribute("y1", bb.y + bb.height + 0.5); ul.setAttribute("y2", bb.y + bb.height + 0.5);
            r.el.appendChild(ul);
            r.tEl.setAttribute("fill", "#000");
            var tip = r.tEl.querySelector("title"); if (tip) tip.textContent += " — open this site on the map";
            r.el.addEventListener("click", function () { try { parent.postMessage({ dbOpenSite: uid }, "*"); } catch (e) {} });
        });
    }
    window.addEventListener("message", function (e) {
        if (e.data && e.data.dbLinkable) { LINKABLE = e.data.dbLinkable; markLinks(); }
    });

    // hover: the company, everything above it and everything it owns
    function focus(id) {
        if (!id) {
            rows.forEach(function (r) { r.el.classList.remove("dimmed"); if (r.lineEl) r.lineEl.classList.remove("dimmed", "highlight-link"); });
            return;
        }
        var keep = {}, up = [id];
        while (up.length) { var c = up.pop(); if (keep[c]) continue; keep[c] = 1;
            LINKS.forEach(function (l) { if (l[0] === c) up.push(l[1]); }); }
        var down = [id], seenD = {};
        while (down.length) { var d = down.pop(); if (seenD[d]) continue; seenD[d] = 1; keep[d] = 1;
            LINKS.forEach(function (l) { if (l[1] === d) down.push(l[0]); }); }
        rows.forEach(function (r) {
            var on = keep[r.id] && (!r.parent || keep[r.parent.id]);
            r.el.classList.toggle("dimmed", !keep[r.id]);
            if (r.lineEl) { r.lineEl.classList.toggle("dimmed", !on); r.lineEl.classList.toggle("highlight-link", !!on); }
        });
    }

    build();
    // The legend lists only the symbols this graph uses, and explains ↗ when it appears.
    (function () {
        var lg = document.getElementById("single-line-legend"); if (!lg) return;
        var kind = function (t) {
            t = t || "s";
            if (t === "p" || t === "parent") return "Parent group";
            if (t === "div_ind" || t === "div" || t === "division") return "Division";
            if (t === "div_ent" || t === "subsidiary") return "Subsidiary";
            if (t === "construction" || t === "cp") return "Construction project";
            if (t === "receiving" || t === "f" || t === "facility") return "Facility";
            return "Affiliated site";
        };
        var used = {}; NODES.forEach(function (n) { used[kind(n.type || n.cargo_type || n.t)] = 1; });
        [].slice.call(lg.querySelectorAll(".legend-item")).forEach(function (it) {
            if (!used[it.textContent.trim()]) it.style.display = "none";
        });
        if (rows.some(function (r) { return r.ref; })) {
            var d = document.createElement("div"); d.className = "legend-item";
            d.innerHTML = '<span style="width:8px;text-align:center">↗</span> Also owned by';
            lg.appendChild(d);
        }
    })();
    var _rt;
    function start() { draw(); }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else setTimeout(start, 200);
    window.addEventListener("resize", function () { clearTimeout(_rt); _rt = setTimeout(draw, 150); });
})();

</script>
<script>
/* Colour of the facility this graph belongs to, passed by the map as ?fc=RRGGBB
   (reception sites run yellow / orange / red / purple by status). Construction
   projects stay green. */
(function(){
  var q=new URLSearchParams(location.search), fc=q.get('fc');
  if(!fc||!/^[0-9a-fA-F]{6}$/.test(fc)) return;
  fc='#'+fc.toUpperCase();
  function paint(){
    document.querySelectorAll('[stroke="#FF0000"],[fill="#FF0000"]').forEach(function(e){
      if(e.getAttribute('stroke')==='#FF0000') e.setAttribute('stroke',fc);
      if(e.getAttribute('fill')==='#FF0000') e.setAttribute('fill',fc);
    });
  }
  document.documentElement.style.setProperty('--col-facility',fc);
  window.addEventListener('load',function(){paint();setTimeout(paint,60);setTimeout(paint,400);});
})();
</script>
</body>
</html>
