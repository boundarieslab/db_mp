<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Index · Dirty Business</title>
<meta name="description" content="The index of every document Dirty Business holds on the reception sites, quarries and construction projects of the Oslo region: photographs, aerials, newspaper articles, permits and reports, by class, site, kommune, period and archive.">
<meta property="og:title" content="Dirty Business — index of documents">
<meta property="og:description" content="Photographs, permits, plans, newspaper articles and registers on the Oslo region's excavated masses, arranged by site, class, decade, kommune, type of site, archive and corporate network.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&display=swap" rel="stylesheet">
<style>
:root{--ink:#000;--sub:#808080;--red:#FF0000;--frame:#bdbdbd;--cell:180px;--obj:164px;--nav:170px}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink)}
body{font:12px/17px 'Cutive Mono','Courier New',monospace;-webkit-font-smoothing:antialiased}
a{color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left;border-radius:0}
#atlas{min-height:100vh;padding:20px;display:flex;flex-wrap:wrap;align-items:flex-start;gap:24px}
#a-nav{flex:0 0 var(--nav);min-width:0;display:flex;flex-direction:column;position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto;scrollbar-width:thin}
#a-q{width:100%;height:22px;padding:0 6px;border:1px solid var(--ink);border-radius:0;outline:none;background:#fff;font:inherit;color:var(--ink);margin-bottom:16px;-webkit-appearance:none;appearance:none}
#a-q::-webkit-search-cancel-button{display:none}
.cat{display:block;line-height:19px;color:var(--sub)}
.cat.on,.cat:hover,.sub:hover,.sub.on,.sec-t:hover,.tm button:hover{color:var(--ink)}
.cat.gap{margin-top:14px}
.subs{display:flex;flex-direction:column;padding:0 0 8px 12px}
.sub{line-height:17px;color:var(--sub)}
#a-main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:28px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-t{align-self:flex-start;animation:fade .5s ease .25s both}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cell),1fr));gap:22px 14px}
.obj{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);min-width:0;transition:opacity .25s}
.obj.dim{opacity:.1}
.obj .im{display:flex;align-items:center;justify-content:center;width:var(--obj);max-width:100%;height:calc(var(--obj) * .8)}
.obj .im img{display:block;max-width:100%;max-height:100%}
.obj .im.no{border:1px solid var(--frame)}
/* first pages of permits and reports: a hairline round the sheet */
img.pg{box-shadow:0 0 0 .5px var(--ink)}
.obj .lb{max-width:100%;padding:0 3px;text-align:center;overflow-wrap:anywhere;font-size:10px;line-height:13px;color:var(--sub)}
.obj:hover .lb{color:var(--ink)}
.open{grid-column:1/-1;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:6px 0 18px}
.open .pic{cursor:zoom-out;display:block;max-width:100%}
.open .pic img{display:block;max-width:100%;max-height:62vh}
.open .pic .no{display:flex;align-items:center;justify-content:center;width:min(480px,80vw);height:min(360px,60vw);border:1px solid var(--frame)}
.open .tt{max-width:560px}
.open .by{max-width:560px;color:var(--sub);margin-top:-6px}
.open .by a{color:inherit;text-decoration:none}
.open .tm{max-width:560px;color:var(--sub)}
.open .tm span{white-space:nowrap}
.open .tm button{white-space:normal;color:var(--sub)}
.open .tm button.k{color:var(--red)}
.open .tm button.on{color:var(--ink)}
.open .ln{display:flex;flex-wrap:wrap;column-gap:16px}
.open .ln .note{color:var(--sub)}
.a-msg{color:var(--sub);margin:0}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sec-t{animation:none}.obj{transition:none}}
@media (max-width:640px){#atlas{padding:12px;gap:16px}#a-nav{flex-basis:100%;position:static;max-height:none}:root{--cell:132px;--obj:120px}}
</style>
</head>
<body>
<div id="atlas">
  <nav id="a-nav" aria-label="Arrange the documents">
    <input id="a-q" type="search" placeholder="Search" aria-label="Search the documents" autocomplete="off">
    <div id="a-cats"></div>
  </nav>
  <main id="a-main"><p class="a-msg">Loading the documents…</p></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<!-- The editor (sites.html?edit) saves this page's look into editor/sites-style.js, apart from the map's. -->
<script>window.__DB_STYLE_CFG = {
  name: 'sites', page: 'sites.html', key: 'db-style-draft-sites', global: '__DB_SITES_STYLE',
  path: 'editor/sites-style.js', nomap: true,
  parts: [
    ['#a-nav', 'Left column'], ['#a-q', 'Search'], ['.cat', 'Category'], ['.subs', 'Groups list'], ['.sub', 'Group name'],
    ['#a-main', 'Documents'], ['.sec-t', 'Group title'], ['.grid', 'Grid'], ['.obj', 'Document'], ['.obj .im', 'Document picture'],
    ['.obj .lb', 'Document label'], ['.open', 'Opened document'], ['.open .tt', 'Opened title'], ['.open .by', 'Opened author'], ['.open .tm', 'Opened terms'],
    ['.open .ln', 'Opened links'], ['body', 'Page']
  ]
};</script>
<script type="application/json" id="db-style">{}</script>
<script src="editor/sites-style.js"></script>
<script src="editor/style-runtime.js"></script>
<script>
(function () {
'use strict';
// ─────────────────────────────────────────────────────────────────────────
// Sources: the published sheet (Documents, Facilities, Projects) and the
// kommune boundaries.
// ─────────────────────────────────────────────────────────────────────────
const SHEET = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS1KaVHKy2zLYGg4Urbhm2zjZkmuATNvIqJOxuECuU0wdickEExV-8G0vL1F7xG1WKn_ADmwwfSARan/pub';
const FACILITIES_CSV = SHEET + '?output=csv';
const PROJECTS_CSV = SHEET + '?gid=529338597&single=true&output=csv';
const DOCUMENTS_CSV = SHEET + '?gid=187064250&single=true&output=csv';
const KOMMUNER = 'data/kommuner.geojson';
// Pictures made for documents that have none in the sheet: the first page of the PDFs
// (tools/doc_thumbs.py).
const THUMBS = 'data/doc_thumbs.json';
// Who issued each document, read from its letterhead (tools/doc_thumbs.py); the sheet's Creator wins.
const AUTHORS = 'data/doc_authors.json';
// Dead links: the Internet Archive copy to open instead, or '' for no link (tools/doc_thumbs.py).
const LINKS = 'data/doc_links.json';
const MAP_LINK = 'https://dirtybusiness.no/#site=';

// The classes of document, in the order they are listed.
const CLASS_ORDER = ['Photograph', 'Aerial photograph', 'Newspaper article', 'Permit', 'Permit application', 'Mining licence', 'Inspection report',
  'Zoning plan', 'Register entry', 'Company record', 'Public record', 'Ownership diagram', 'Terrain change', 'Report', 'Government document',
  'Government page', 'Public notice', 'Municipal page', 'Company page'];
// Classes left out of the index: register and web entries with nothing to look at.
const HIDDEN = new Set(['Terrain change', 'Ownership diagram', 'Zoning plan', 'Company page', 'Company record',
  'Register entry', 'Public record', 'Municipal page', 'Government page', 'Public notice']);
// A document without a picture is drawn as one line icon of its kind.
const ICON = {
  photo: 'M4 7h24v18H4z M4 21l7-7 6 6 4-4 7 7 M20 11h3v3h-3z',
  page: 'M8 3h11l5 5v21H8z M19 3v5h5 M11 13h10 M11 17h10 M11 21h7',
  press: 'M4 6h24v20H4z M7 9h8v7H7z M18 9h7 M18 12h7 M18 15h7 M7 19h18 M7 22h18',
  plan: 'M4 8l8-3 8 3 8-3v19l-8 3-8-3-8 3z M12 5v19 M20 8v19',
  card: 'M3 8h26v16H3z M6 12h9 M6 16h12 M6 20h10 M21 11h5v7h-5z',
  tree: 'M13 3h6v5h-6z M16 8v4 M7 12h18 M7 12v5 M25 12v5 M4 17h6v5H4z M22 17h6v5h-6z M16 12v5 M13 17h6v5h-6z',
  terrain: 'M3 25h26 M3 21c5-5 9-5 12-2s7 2 14-3 M5 16c4-4 8-4 10-2s6 2 10-3 M9 11c3-3 6-3 8-1s4 1 6-2',
  web: 'M3 6h26v20H3z M3 10h26 M6 14h10 M6 18h20 M6 22h14'
};
const KIND = {
  'Photograph': 'photo', 'Aerial photograph': 'photo', 'Newspaper article': 'press', 'Permit': 'page', 'Permit application': 'page',
  'Mining licence': 'page', 'Inspection report': 'page', 'Zoning plan': 'plan', 'Register entry': 'card', 'Company record': 'card',
  'Public record': 'card', 'Ownership diagram': 'tree', 'Terrain change': 'terrain', 'Report': 'page', 'Government document': 'page',
  'Government page': 'web', 'Public notice': 'web', 'Municipal page': 'web', 'Company page': 'web'
};

// ─────────────────────────────────────────────────────────────────────────
// Helpers
// ─────────────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ESC[c]);
// Licence of a document shown with its picture: the name, linked to the licence text (CC: credit, licence link).
const LICENCES = [[/^CC BY-NC-ND/i, 'https://creativecommons.org/licenses/by-nc-nd/4.0/deed.no'], [/^CC BY-NC-SA/i, 'https://creativecommons.org/licenses/by-nc-sa/4.0/deed.no'],
  [/^CC BY-NC/i, 'https://creativecommons.org/licenses/by-nc/4.0/deed.no'], [/^CC BY-SA/i, 'https://creativecommons.org/licenses/by-sa/4.0/deed.no'],
  [/^CC BY-ND/i, 'https://creativecommons.org/licenses/by-nd/4.0/deed.no'], [/^CC BY/i, 'https://creativecommons.org/licenses/by/4.0/deed.no'],
  [/^CC0/i, 'https://creativecommons.org/publicdomain/zero/1.0/deed.no'], [/^public domain/i, 'https://creativecommons.org/publicdomain/mark/1.0/deed.no']];
const licUrl = v => { const m = LICENCES.find(([re]) => re.test(v)); return m ? m[1] : ''; };
const safeUrl = v => { const u = String(v == null ? '' : v).trim(); return /^(https?:\/\/|\/|\.\/|data\/|assets\/|#)/i.test(u) ? u : ''; };
const num = v => parseFloat(String(v == null ? '' : v).replace(',', '.'));
const isTrue = v => /^(true|yes|1)$/i.test(String(v == null ? '' : v).trim());
const uidOf = s => (s && (s.UID || s.fid)) || '';
const coll = new Intl.Collator('nb');

const fold = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ø/g, 'o').replace(/æ/g, 'ae');
// A short name for the label under a document; groups and the opened document keep the full name.
const short = n => String(n || '').replace(/\s*\(.*?\)\s*/g, ' ').replace(/\b(nedlagte deponi|avfallsdeponi|massemottak|deponi)\b/gi, '').replace(/\s+/g, ' ').trim() || n;

// ─────────────────────────────────────────────────────────────────────────
// Data
// ─────────────────────────────────────────────────────────────────────────
let SITES = [], BYUID = {}, KOM = [], DOCS = [], BYID = {}, HAY = {};
const parseCsv = url => new Promise((res, rej) => Papa.parse(url, {
  download: true, header: true, skipEmptyLines: true, transformHeader: h => h.trim(), complete: res, error: rej }));
const getJson = u => fetch(u).then(r => r.ok ? r.json() : null).catch(() => null);
function inRing(x, y, ring) {
  let ins = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) ins = !ins;
  }
  return ins;
}
const inGeom = (x, y, g) => (g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [])
  .some(p => inRing(x, y, p[0]) && !p.slice(1).some(h => inRing(x, y, h)));
const kByName = n => KOM.find(k => coll.compare(k.n, String(n || '').trim()) === 0);

function prepare(f, p, d, kom, th, au, ln) {
  const tag = cat => r => { r.__cat = cat; return r; };
  SITES = [...f.filter(r => uidOf(r) && isTrue(r.Published)).map(tag('facility')), ...p.filter(r => uidOf(r) && isTrue(r.Published)).map(tag('project'))];
  BYUID = {}; SITES.forEach(s => { BYUID[uidOf(s)] = s; });
  KOM = ((kom || {}).features || []).map(ft => ({ nr: ft.properties.nr, n: ft.properties.n, g: ft.geometry }));
  SITES.forEach(s => {
    const x = num(s.Longitude), y = num(s.Latitude);
    let k = kByName(s.Municipality);
    if (!k && Number.isFinite(x) && Number.isFinite(y)) k = KOM.find(k => inGeom(x, y, k.g));
    s.__kn = k ? k.n : String(s.Municipality || '').trim();
    s.__ty = String(s.Type || '').trim();
  });
  // Documents: published, and tied to a published site or to none.
  th = th || {}; au = au || {}; ln = ln || {};
  DOCS = d.filter(r => r.DocID && isTrue(r.Published) && !HIDDEN.has(String(r.Class || '').trim())).map(r => {
    const named = String(r.Sites || '').split(/[;,]/).map(x => x.trim()).filter(Boolean);
    r.__sites = named.filter(u => BYUID[u]).map(u => BYUID[u]);
    if (named.length && !r.__sites.length) return null;
    const m = /(?<!\d)(1[89]\d\d|20\d\d)(?!\d)/.exec(String(r.Date || ''));
    r.__year = m ? +m[1] : null;
    r.__dec = r.__year ? Math.floor(r.__year / 10) * 10 + 's' : '';
    r.__acc = String(r.Access || 'open').trim().toLowerCase() || 'open';
    const img = safeUrl(r.Image);
    r.__img = r.__acc === 'open' ? (img || safeUrl(th[r.DocID])) : '';
    const ks = new Set(r.__sites.map(s => s.__kn).filter(Boolean));
    String(r.Kommune || '').split(/[;,/]/).forEach(n => { const k = kByName(n); if (k) ks.add(k.n); else if (n.trim() && !r.__sites.length) ks.add(n.trim()); });
    r.__k = [...ks];
    r.__arch = String(r.Archive || '').trim();
    r.__by = String(r.Creator || '').trim() || String(au[r.DocID] || '').trim();
    r.__lic = String(r.Licence || '').trim();
    r.__link = r.DocID in ln ? safeUrl(ln[r.DocID]) : safeUrl(r.Link);
    r.__lost = r.DocID in ln && !r.__link;                  // gone from the web, no archived copy
    r.__archived = /web\.archive\.org/.test(r.__link);   // opened from the Internet Archive
    r.__siteNames = r.__sites.map(s => String(s.Name || '').trim()).filter(Boolean);
    r.__ty = uniq(r.__sites.map(s => s.__ty).filter(Boolean));
    r.__icon = ICON[KIND[r.Class] || 'page'];
    const where = r.__siteNames[0] ? short(r.__siteNames[0]) : (r.__k[0] || '');
    r.__label = [where, r.__year].filter(Boolean).join(' ');
    return r;
  }).filter(Boolean);
  DOCS.sort((a, b) => (a.__year || 9999) - (b.__year || 9999) || coll.compare(a.Class, b.Class) || coll.compare(a.Title, b.Title));
  BYID = {}; HAY = {};
  DOCS.forEach(r => {
    BYID[r.DocID] = r;
    HAY[r.DocID] = fold([r.Class, r.Title, r.__year, r.__siteNames.join(' '), r.__k.join(' '), r.__ty.join(' '), r.__arch, r.Creator].join(' '));
  });
}
const uniq = a => [...new Set(a)];

// ─────────────────────────────────────────────────────────────────────────
// The ways to arrange the documents.
// ─────────────────────────────────────────────────────────────────────────
const CATS = [
  { id: 'site', label: 'Site', of: d => d.__siteNames },
  { id: 'cls', label: 'Class', of: d => d.Class ? [d.Class] : [], order: CLASS_ORDER },
  { id: 'dec', label: 'Decade', of: d => d.__dec ? [d.__dec] : [], dec: true },
  { id: 'k', label: 'Kommune', of: d => d.__k },
  { id: 'ty', label: 'Type of site', of: d => d.__ty },
  { id: 'arch', label: 'Archive', of: d => d.__arch ? [d.__arch] : [] }
];
const catOf = id => CATS.find(c => c.id === id);
function groupsOf(cat) {
  const groups = {}, none = [];
  DOCS.forEach(d => { const vs = cat.of(d); if (!vs.length) none.push(d); vs.forEach(v => (groups[v] = groups[v] || []).push(d)); });
  let keys = Object.keys(groups);
  if (cat.order) keys = cat.order.filter(k => groups[k]).concat(keys.filter(k => !cat.order.includes(k)).sort((a, b) => coll.compare(a, b)));
  else if (cat.dec) keys.sort(); else keys.sort((a, b) => coll.compare(a, b));
  const list = keys.map(k => [k, groups[k]]);
  if (none.length) list.push([cat.dec ? 'Undated' : 'None', none]);
  return list;
}

// ─────────────────────────────────────────────────────────────────────────
// Address: #by=cls&g=Photograph, #doc=ID, #q=word — so a view can be shared.
// ─────────────────────────────────────────────────────────────────────────
let state = { by: '', g: '', doc: '', q: '' };
function readHash() {
  const o = { by: '', g: '', doc: '', q: '' };
  location.hash.replace(/^#/, '').split('&').forEach(kv => {
    const i = kv.indexOf('='); if (i < 1) return;
    const k = kv.slice(0, i); let v = kv.slice(i + 1); try { v = decodeURIComponent(v); } catch (e) {}
    if (k in o) o[k] = v;
  });
  if (!catOf(o.by)) { o.by = ''; o.g = ''; }
  if (o.doc && !BYID[o.doc]) o.doc = '';
  return o;
}
function writeHash() {
  const parts = ['by', 'g', 'doc', 'q'].filter(k => state[k]).map(k => k + '=' + encodeURIComponent(state[k]));
  history.replaceState(null, '', parts.length ? '#' + parts.join('&') : location.pathname + location.search);
}

// ─────────────────────────────────────────────────────────────────────────
// The documents move themselves: where each stands is noted before the
// arrangement changes, and after it each glides from there to its new place.
// ─────────────────────────────────────────────────────────────────────────
const still = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function capture() {
  const m = {};
  document.querySelectorAll('#a-main [data-id]').forEach(el => {
    if (m[el.dataset.id]) return;
    const b = el.getBoundingClientRect(); m[el.dataset.id] = { x: b.left, y: b.top };
  });
  return m;
}
function glide(prev) {
  if (!prev || !Element.prototype.animate || still()) return;
  const seen = {}, vh = window.innerHeight || 900;
  document.querySelectorAll('#a-main [data-id]').forEach((el, i) => {
    const id = el.dataset.id, b = el.getBoundingClientRect(), p = prev[id];
    if (el.classList.contains('open')) el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 400, delay: 200, fill: 'backwards' });
    else if (p && !seen[id]) {
      const dx = p.x - b.left, dy = p.y - b.top;
      if ((dx || dy) && (b.top < vh * 1.5 || p.y < vh * 1.5))
        el.animate([{ transform: 'translate(' + dx + 'px,' + dy + 'px)' }, { transform: 'translate(0,0)' }],
                   { duration: 750, easing: 'cubic-bezier(.2,.7,.2,1)', delay: Math.min(i * 0.8, 220), fill: 'backwards' });
    } else if (b.top < vh * 1.5) el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 450, delay: 350, fill: 'backwards' });
    seen[id] = 1;
  });
}

// ─────────────────────────────────────────────────────────────────────────
// Drawing
// ─────────────────────────────────────────────────────────────────────────
const svgIcon = (d, z, w) => `<svg width="${z}" height="${z}" viewBox="0 0 32 32" aria-hidden="true"><path d="${d}" fill="#fff" stroke="#000" stroke-width="${w}"/></svg>`;
function obj(d) {
  const pg = /^assets\/docs\//.test(d.__img) ? ' class="pg"' : '';
  const pic = d.__img ? `<img${pg} src="${esc(d.__img)}" alt="" loading="lazy" decoding="async">` : svgIcon(d.__icon, 22, 1);
  return `<a class="obj" href="#doc=${encodeURIComponent(d.DocID)}" data-id="${esc(d.DocID)}" data-doc="${esc(d.DocID)}" title="${esc(d.Title)}"><span class="im${d.__img ? '' : ' no'}">${pic}</span><span class="lb">${esc(d.__label)}</span></a>`;
}
function opened(d) {
  const pg = /^assets\/docs\//.test(d.__img) ? ' class="pg"' : '';
  const pic = d.__img ? `<img${pg} src="${esc(d.__img)}" alt="${esc(d.Title)}">` : `<span class="no">${svgIcon(d.__icon, 32, .8)}</span>`;
  const terms = [].concat(d.__siteNames.map(v => ['site', v]), d.__dec ? [['dec', d.__dec]] : [], d.__k.map(v => ['k', v]),
                          d.Class ? [['cls', d.Class]] : [], d.__arch ? [['arch', d.__arch]] : []);
  const tm = terms.map(([c, v], i) => {
    const on = state.by === c && state.g === v;
    return `<span><button class="${c === 'k' ? 'k' : ''}${on ? ' on' : ''}" data-term="${c}" data-val="${esc(v)}">${esc(v)}</button>${i < terms.length - 1 ? ', ' : ''}</span>`;
  }).join('');
  const link = d.__link, site = d.__sites[0];
  const note = d.__acc !== 'open' ? `<span class="note">${esc(d.__acc)}</span>` : '';
  return `<div class="open" data-id="${esc(d.DocID)}">` +
    `<button class="pic" data-close aria-label="Close">${pic}</button>` +
    `<div class="tt">${esc(d.Title)}</div>` +
    // who made it: the source is always named (åndsverkloven § 25)
    (d.__by ? `<div class="by">${esc(d.__by)}</div>` : '') +
    // licence, when the picture is shown under one
    (d.__img && licUrl(d.__lic) ? `<div class="by"><a href="${esc(licUrl(d.__lic))}" target="_blank" rel="noopener noreferrer">${esc(d.__lic)}</a></div>` : '') +
    (tm ? `<div class="tm">${tm}</div>` : '') +
    `<div class="ln">${note}${d.__lost ? '<span class="note">no longer available online</span>' : ''}` +
    `${link ? `<a href="${esc(link)}" target="_blank" rel="noopener noreferrer">${d.__archived ? 'archived copy ↗' : 'document ↗'}</a>` : ''}` +
    `${site ? `<a href="${esc(MAP_LINK + encodeURIComponent(uidOf(site)))}" target="_top">map →</a>` : ''}<button data-close>close ×</button></div></div>`;
}
function grid(ds, shown) {
  return '<div class="grid">' + ds.map(d => {
    if (d.DocID === state.doc && !shown.done) { shown.done = 1; return opened(d); }
    return obj(d);
  }).join('') + '</div>';
}
function render() {
  const cat = catOf(state.by), shown = {};
  let html, list = [];
  if (!cat) html = `<section class="sec">${grid(DOCS, shown)}</section>`;
  else {
    list = groupsOf(cat);
    html = list.filter(([k]) => !state.g || state.g === k)
      .map(([k, ds]) => `<section class="sec"><button class="sec-t" data-g="${esc(k)}">${esc(k)}</button>${grid(ds, shown)}</section>`).join('');
  }
  $('a-main').innerHTML = html;
  $('a-cats').innerHTML = CATS.map(c => {
    const on = c.id === state.by;
    const subs = on ? `<div class="subs">${list.map(([k]) => `<button class="sub${state.g === k ? ' on' : ''}" data-g="${esc(k)}">${esc(k)}</button>`).join('')}</div>` : '';
    return `<button class="cat${on ? ' on' : ''}${c.gap ? ' gap' : ''}" data-by="${c.id}">${esc(c.label)}</button>${subs}`;
  }).join('');
  search();
  const d = BYID[state.doc];
  document.title = (d ? d.Title + ' · ' : '') + 'Index · Dirty Business';
  writeHash();
}
function search() {
  const terms = fold(state.q).split(/\s+/).filter(Boolean);
  document.querySelectorAll('#a-main .obj').forEach(el => {
    const h = HAY[el.dataset.id] || '';
    el.classList.toggle('dim', !!terms.length && !terms.every(t => h.includes(t)));
  });
}
function change(next, toTop) {
  const prev = capture();
  Object.assign(state, next);
  render();
  if (toTop) window.scrollTo(0, 0);
  glide(prev);
  const o = document.querySelector('#a-main .open');
  if (o && next.doc) setTimeout(() => o.scrollIntoView({ block: 'nearest', behavior: still() ? 'auto' : 'smooth' }), 60);
}

document.addEventListener('click', e => {
  const el = e.target.closest('button,a');
  if (!el || document.documentElement.classList.contains('dbx-sel') || document.documentElement.classList.contains('dbx-txt')) return;
  if (el.dataset.by) { change({ by: state.by === el.dataset.by ? '' : el.dataset.by, g: '' }); return; }
  if (el.dataset.g != null) { change({ g: state.g === el.dataset.g ? '' : el.dataset.g }, true); return; }
  if (el.dataset.term) {
    const on = state.by === el.dataset.term && state.g === el.dataset.val;
    change({ by: el.dataset.term, g: on ? '' : el.dataset.val, doc: '' }, true); return;
  }
  if (el.hasAttribute('data-close')) { change({ doc: '' }); return; }
  if (el.dataset.doc) { e.preventDefault(); change({ doc: state.doc === el.dataset.doc ? '' : el.dataset.doc }); }
});
// A picture that cannot be fetched gives way to the line icon of its kind.
document.addEventListener('error', e => {
  const img = e.target;
  if (!img || img.tagName !== 'IMG') return;
  const box = img.closest('[data-id]'), d = box && BYID[box.dataset.id];
  if (!d) return;
  if (box.classList.contains('open')) img.outerHTML = `<span class="no">${svgIcon(d.__icon, 32, .8)}</span>`;
  else { img.parentNode.classList.add('no'); img.outerHTML = svgIcon(d.__icon, 22, 1); }
}, true);
$('a-q').addEventListener('input', e => { state.q = e.target.value; search(); writeHash(); });
window.addEventListener('hashchange', () => { const o = readHash(); if (['by', 'g', 'doc', 'q'].some(k => o[k] !== state[k])) { state = o; $('a-q').value = state.q; render(); } });

Promise.all([parseCsv(FACILITIES_CSV), parseCsv(PROJECTS_CSV), parseCsv(DOCUMENTS_CSV), getJson(KOMMUNER), getJson(THUMBS), getJson(AUTHORS), getJson(LINKS)])
  .then(([f, p, d, kom, th, au, ln]) => {
    prepare(f.data || [], p.data || [], d.data || [], kom, th, au, ln);
    if (!DOCS.length) throw new Error('empty');
    state = readHash();
    $('a-q').value = state.q;
    render();
    if (state.doc) { const o = document.querySelector('#a-main .open'); if (o) o.scrollIntoView({ block: 'center' }); }
  })
  .catch(err => { console.error(err); $('a-main').innerHTML = '<p class="a-msg">The database could not be read. Try again in a minute.</p>'; });
})();
</script>
<script src="assets/scan-dot.js?v=3"></script>
