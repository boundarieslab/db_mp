<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Index · Dirty Business</title>
<meta name="description" content="The index of every document Dirty Business holds on the reception sites, quarries and construction projects of the Oslo region: photographs, aerials, newspaper articles, permits, plans, register entries, ownership diagrams and terrain-change sheets, by class, site, kommune, period and archive.">
<meta property="og:title" content="Dirty Business — index of documents">
<meta property="og:description" content="Photographs, permits, plans, newspaper articles and registers on the Oslo region's excavated masses, sorted by class, site, kommune and period.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   dirtybusiness.no — the index of documents.
   After the Atlas des Régions Naturelles: every document is one entry, and
   the terms are ways to sort them. An index column on the left; terms in
   groups, a light grotesque for the terms and its regular weight, in
   capitals, for the group names. No rules, no boxes, no rounded corners.
   Colour belongs to the data: the status colours of the map, and red for
   what is chosen.
   The documents are the Documents tab of db_database; the look is edited at
   sites.html?edit.
   ========================================================================== */
@font-face{font-family:PlexMono;src:url(assets/fonts/plex-mono-400.woff2) format('woff2');font-weight:400;font-display:swap}
:root{
  --ink:#000;
  --sub:#8a8a8a;         /* secondary text, terms with nothing under the choice */
  --pick:#FF0000;        /* what is chosen: chip, term, kommune */
  --link:#0000FF;        /* a link out to the document */
  --plate:#f3f3f3;       /* the ground of a document with no picture */
  --light:"Work Sans",Helvetica,Arial,sans-serif;
  --fs:14px;
  --lh:1.72;             /* ARN's line: 24 px over 14 px */
  --fs-small:11px;
  --pad:26px;
  --nav:29%;
  --gap:44px;
  --thumb:190px;
}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0;padding:0;background:#fff;color:var(--ink)}
body{font:300 var(--fs)/var(--lh) var(--light);-webkit-font-smoothing:antialiased;letter-spacing:.01em}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit;text-align:left}
.cap{font-weight:400;text-transform:uppercase;letter-spacing:.04em}
.mono{font-family:PlexMono,ui-monospace,monospace;font-size:var(--fs-small);letter-spacing:0}
[hidden]{display:none!important}
:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.u:hover,.t:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:.5px}

/* ---------- frame ---------- */
#atlas{display:grid;grid-template-columns:var(--nav) 1fr;min-height:100vh;padding:var(--pad) var(--pad) 0}
#a-nav{position:sticky;top:var(--pad);align-self:start;padding-right:24px}
#a-title{font-weight:300;font-size:30px;line-height:1.05;letter-spacing:-.005em;margin:0 0 54px}
#a-title small{display:block;font-size:var(--fs-small);letter-spacing:.04em;margin-top:12px;color:var(--sub);text-transform:uppercase;font-weight:400}
#a-nav .nv{display:block;margin:0 0 30px}
#a-nav .nv:hover,#a-nav .nv.on{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:.5px}
#a-lang{margin-top:56px;font-size:var(--fs-small)}
#a-lang button{margin-right:10px;color:var(--sub)}
#a-lang button.on{color:var(--ink)}
#a-main{min-width:0;padding-bottom:80px}

/* ---------- top lines ---------- */
.a-top{margin:0 0 var(--gap)}
.a-top .ln{display:block}
.a-top .ln .cap{margin-right:.35em}
.a-top .t+.t::before{content:", ";color:var(--ink)}

/* ---------- groups of terms ---------- */
.a-cols{display:grid;grid-template-columns:1fr 1fr;column-gap:40px}
.grp{margin:0 0 var(--gap);break-inside:avoid}
.grp h3{margin:0;font:inherit}
.grp .t{display:block}
.t{cursor:pointer}
.t.on{color:var(--pick)}
.t.none{color:var(--sub);cursor:default;text-decoration:none}
.t small{color:var(--sub);font-size:var(--fs-small);margin-left:6px}
.more{color:var(--sub);display:block}

/* ---------- chosen terms ---------- */
.a-chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:0 0 30px}
.chip{border:1px solid var(--pick);color:var(--pick);padding:0 6px;line-height:22px;font-size:13px;white-space:nowrap}
.chip b{font-weight:300;margin-left:6px}
.a-count,.a-clear{color:var(--sub);font-size:var(--fs-small);text-transform:uppercase;letter-spacing:.04em;font-weight:400}
.a-clear:hover{color:var(--ink)}

/* ---------- the chosen site ---------- */
.a-head{margin:0 0 30px}
.a-head h2{font-weight:300;font-size:26px;line-height:1.1;margin:0;display:flex;align-items:center;gap:10px}
.a-head .wh{margin-top:4px}
.a-head .wh a{margin-left:14px}

/* ---------- documents ---------- */
.a-res{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--thumb),1fr));gap:34px 22px}
.card{display:block;min-width:0}
.card .im{display:block;aspect-ratio:4/3;overflow:hidden;position:relative;background:var(--plate)}
.card .im img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1);transition:filter .2s}
.card:hover .im img{filter:none}
.plate{position:absolute;inset:0;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;background:var(--plate)}
.plate .k{font-size:var(--fs-small);text-transform:uppercase;letter-spacing:.04em;font-weight:400}
.plate .y{font-size:34px;font-weight:300;line-height:1;letter-spacing:-.01em}
.plate .a{font-size:var(--fs-small);color:var(--sub);line-height:1.35}
.card .nm{display:block;margin-top:8px;line-height:1.35}
.card .ds{display:block;color:var(--sub);font-size:var(--fs-small);line-height:1.4;margin-top:3px}
.card .ds .ask{color:var(--pick)}
.card:hover .nm{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:.5px}

/* ---------- kommune map ---------- */
#a-kmap{display:block;width:auto;max-width:100%;height:auto;max-height:calc(100vh - 2 * var(--pad) - 60px);margin:0 0 30px}
#a-kmap path{fill:#fff;stroke:#b9b9b9;stroke-width:.5px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
#a-kmap path.has{stroke:var(--ink);cursor:pointer}
#a-kmap path.has:hover{fill:#e6e6e6}
#a-kmap path.on,#a-kmap path.on:hover{fill:var(--pick)}
#a-kmap circle{stroke:#000;stroke-width:.4px;vector-effect:non-scaling-stroke;pointer-events:none}
#a-ktip{position:fixed;pointer-events:none;background:#fff;border:1px solid var(--ink);padding:0 6px;line-height:22px;font-size:13px;display:none;z-index:5}

/* ---------- status colours, pictograms, sites ---------- */
.a-sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:26px 22px}
.a-sw .t{display:flex;align-items:center;gap:12px}
.a-sw .dot{width:34px;height:34px;flex:0 0 34px;border:3px solid;border-radius:50%}
.a-sw .sq{width:34px;height:34px;flex:0 0 34px;border:3px solid}
.a-pic{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 22px}
.a-pic .t{display:block}
.a-pic img{width:100%;aspect-ratio:4/3;object-fit:contain;display:block}
.a-pic .t span{display:block;margin-top:4px;line-height:1.35}
.a-az{column-width:240px;column-gap:30px}
.a-az .lt{break-after:avoid;margin:18px 0 0}
.a-az .lt:first-child{margin-top:0}
.a-az .t{display:flex;align-items:baseline;gap:6px;break-inside:avoid;line-height:1.5;padding:1px 0}
.a-az .t svg{flex:0 0 auto;position:relative;top:1px}

/* ---------- one document ---------- */
.a-doc{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);column-gap:40px;align-items:start;max-width:1200px}
.a-doc .pic{position:relative;background:var(--plate);min-height:240px}
.a-doc .pic img{display:block;width:100%;height:auto;max-height:calc(100vh - 2 * var(--pad) - 40px);object-fit:contain;background:#fff}
.a-doc .pic .plate{position:relative;aspect-ratio:4/3}
.a-doc .pic .plate .y{font-size:64px}
.a-doc .pic iframe{display:block;width:100%;height:520px;border:0;background:#fff}
.a-doc h1{font-weight:300;font-size:26px;line-height:1.15;margin:0 0 18px;letter-spacing:-.005em;overflow-wrap:anywhere}
.a-doc .r{display:grid;grid-template-columns:34% 1fr;column-gap:14px;line-height:1.5;padding:2px 0}
.a-doc .r .k{font-size:var(--fs-small);text-transform:uppercase;letter-spacing:.04em;font-weight:400;padding-top:2px}
.a-doc .r .v{min-width:0;overflow-wrap:anywhere}
.a-doc .r .v .t{display:inline}
.a-doc .st{display:flex;align-items:baseline;gap:6px}
.a-doc .st svg{position:relative;top:1px;flex:0 0 auto}
.a-doc .go{display:block;margin-top:22px;color:var(--link)}
.a-doc .go+.go{margin-top:6px}
.a-doc .nav{margin-top:30px;font-size:var(--fs-small);color:var(--sub);text-transform:uppercase;letter-spacing:.04em;font-weight:400}
.a-doc .nav button{margin-right:18px}
.a-doc .nav button:hover{color:var(--ink)}
.a-doc .ask{color:var(--pick)}
.a-msg{color:var(--sub)}

/* ---------- phone ---------- */
@media (max-width:760px){
  :root{--pad:16px;--gap:30px;--thumb:140px;--fs:13px}
  #atlas{grid-template-columns:1fr}
  #a-nav{position:static;padding:0 0 18px}
  #a-title{font-size:24px;margin-bottom:20px}
  #a-nav .nv{display:inline-block;margin:0 16px 8px 0}
  #a-lang{margin-top:8px}
  .a-cols,.a-doc{grid-template-columns:1fr}
  .a-doc .pic{margin-bottom:20px}
  .a-doc .pic iframe{height:360px}
}
</style>
</head>
<body>
<div id="atlas">
  <nav id="a-nav" aria-label="Index">
    <h1 id="a-title"><span data-en="Index" data-no="Register">Index</span><small id="a-tally"></small></h1>
    <button class="nv cap" data-go="terms" data-en="Index of documents" data-no="Dokumentregister">Index of documents</button>
    <button class="nv cap" data-go="sites" data-en="Index of sites" data-no="Stedsregister">Index of sites</button>
    <button class="nv cap" data-go="kommuner" data-en="Index of kommuner" data-no="Kommuneregister">Index of kommuner</button>

<script>
(function () {
'use strict';
// ─────────────────────────────────────────────────────────────────────────
// Sources: the published sheet (Documents, Facilities, Projects) and the
// map's own files.
// ─────────────────────────────────────────────────────────────────────────
const SHEET = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS1KaVHKy2zLYGg4Urbhm2zjZkmuATNvIqJOxuECuU0wdickEExV-8G0vL1F7xG1WKn_ADmwwfSARan/pub';
const FACILITIES_CSV = SHEET + '?output=csv';
const PROJECTS_CSV = SHEET + '?gid=529338597&single=true&output=csv';
const DOCUMENTS_CSV = SHEET + '?gid=187064250&single=true&output=csv';
const KOMMUNER = 'data/kommuner.geojson';
const MAP_LINK = 'https://dirtybusiness.no/#site=';

// The classes of document, in groups, as the Atlas groups its terms.
const CLASS_GROUPS = [
  ['g_images', ['Photograph', 'Aerial photograph']],
  ['g_press', ['Newspaper article']],
  ['g_permits', ['Permit', 'Permit application', 'Mining licence', 'Inspection report']],
  ['g_plans', ['Zoning plan']],
  ['g_registers', ['Register entry', 'Company record', 'Public record', 'Ownership diagram']],
  ['g_studies', ['Terrain change', 'Report', 'Government document', 'Government page']],
  ['g_web', ['Public notice', 'Municipal page', 'Company page']]
];
const CLASS_NO = {
  'Photograph': 'Fotografi', 'Aerial photograph': 'Flyfoto', 'Newspaper article': 'Avisartikkel', 'Permit': 'Tillatelse',
  'Permit application': 'Søknad', 'Mining licence': 'Driftskonsesjon', 'Inspection report': 'Kontrollrapport', 'Zoning plan': 'Reguleringsplan',
  'Register entry': 'Registeroppføring', 'Company record': 'Foretaksopplysninger', 'Public record': 'Offentlig journal',
  'Ownership diagram': 'Eierskapsdiagram', 'Terrain change': 'Terrengendring', 'Report': 'Rapport', 'Government document': 'Statlig dokument',
  'Government page': 'Statlig nettside', 'Public notice': 'Kunngjøring', 'Municipal page': 'Kommunal nettside', 'Company page': 'Bedriftens nettside'
};

// ─────────────────────────────────────────────────────────────────────────
// Words
// ─────────────────────────────────────────────────────────────────────────
const W = {
  g_images: ['Images', 'Bilder'], g_press: ['Press', 'Presse'], g_permits: ['Permits', 'Tillatelser'], g_plans: ['Plans', 'Planer'],
  g_registers: ['Registers', 'Registre'], g_studies: ['Studies and reports', 'Studier og rapporter'], g_web: ['Web pages', 'Nettsider'],
  decade: ['Decade', 'Tiår'], access: ['Access', 'Tilgang'], family: ['Family', 'Familie'], reception: ['Reception', 'Mottak'],
  extraction: ['Extraction', 'Uttak'], construction: ['Construction', 'Anlegg'], undated: ['undated', 'udatert'],
  a_open: ['open', 'åpen'], 'a_permission asked': ['permission asked', 'tillatelse etterspurt'], a_restricted: ['restricted', 'begrenset'],
  type: ['Type of site', 'Type sted'], ptype: ['Construction projects', 'Anleggsprosjekter'], status: ['Status of site', 'Status for stedet'],
  kommune: ['Kommune', 'Kommune'], archive: ['Archive', 'Arkiv'], site: ['Site', 'Sted'], cls: ['Class', 'Klasse'], pictogram: ['Pictogram', 'Piktogram'],
  st_active: ['active', 'i drift'], st_old: ['closed or finished', 'nedlagt eller ferdig'], st_future: ['planned', 'planlagt'],
  st_contaminated: ['contaminated masses', 'forurensede masser'], st_unknown: ['no status', 'ukjent'],
  docs: ['documents', 'dokumenter'], doc1: ['document', 'dokument'], sitesN: ['sites', 'steder'],
  more: ['more', 'flere'], fewer: ['fewer', 'færre'], clear: ['clear', 'tøm'], none: ['No document answers all of these.', 'Ingen dokumenter passer alle disse.'],
  pickK: ['Choose a kommune on the map.', 'Velg en kommune i kartet.'],
  f_class: ['Class', 'Klasse'], f_date: ['Date', 'Dato'], f_sites: ['Site', 'Sted'], f_kommune: ['Kommune', 'Kommune'], f_archive: ['Archive', 'Arkiv'],
  f_creator: ['Made by', 'Laget av'], f_licence: ['Licence', 'Lisens'], f_access: ['Access', 'Tilgang'], f_note: ['Note', 'Merknad'], f_id: ['Number', 'Nummer'],
  open: ['Open the document', 'Åpne dokumentet'], map: ['Open on the map', 'Åpne i kartet'], prev: ['previous', 'forrige'], next: ['next', 'neste'],
  back: ['back to the list', 'tilbake til listen'], askNote: ['Shown here once the owner allows it.', 'Vises her når eieren gir tillatelse.'],
  loadfail: ['The database could not be read. Try again in a minute.', 'Databasen kunne ikke leses. Prøv igjen om et minutt.'],
  notfound: ['There is no published document with this number.', 'Det finnes ikke noe publisert dokument med dette nummeret.']
};
let lang = 'en';
try { lang = new URLSearchParams(location.search).get('lang') || localStorage.getItem('db-sites-lang') || 'en'; } catch (e) {}
if (lang !== 'no') lang = 'en';
const NO = () => lang === 'no';
const t = k => (W[k] || [k, k])[NO() ? 1 : 0];
const clsWord = c => NO() ? (CLASS_NO[c] || c) : c;

// ─────────────────────────────────────────────────────────────────────────
// Helpers, as in the map
// ─────────────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ESC[c]);
const safeUrl = v => { const u = String(v == null ? '' : v).trim(); return /^(https?:\/\/|\/|\.\/|data\/|#)/i.test(u) ? u : ''; };
const num = v => parseFloat(String(v == null ? '' : v).replace(',', '.'));
const isTrue = v => /^(true|yes|1)$/i.test(String(v == null ? '' : v).trim());
const uidOf = s => (s && (s.UID || s.fid)) || '';
const coll = new Intl.Collator('nb');

// Status, as the map classifies it (index.html, statusClass).
const RX_FUTURE = /\b(planned|planlagt|proposed|foresl|future|framtid|fremtid|under bygging|hearing|høring|horing|søknad|soknad|to come|kommende|regulert)/;
const RX_OLD    = /\b(inactive|inaktiv|closed|lukket|nedlagt|historical|historisk|avsluttet|ferdig|complete|finished|etterdrift|ended)/;
const RX_ACTIVE = /\b(active|aktiv|operating|i drift|drift|open|pågår|pagar|under way|ongoing|still receiv)/;
const RX_CONT   = /(spesialdeponi|farlig avfall|jordvask|soil washing|forurensede masser|contaminated soil treatment)/;
function statusClass(site) {
  const cat = site.__cat;
  const own = String(site.StatusClass || '').toLowerCase().trim();
  if (own) {
    if (/cont|forur|purple/.test(own)) return cat === 'facility' ? 'contaminated' : 'active';
    if (/old|closed|nedlagt|finish|ferdig|done/.test(own)) return 'old';
    if (/future|plan|come|komm/.test(own)) return 'future';
    if (/activ|aktiv|way|pågår/.test(own)) return 'active';
  }
  if (cat === 'facility' && RX_CONT.test([site.Type, site.Subtype, site.Name].join(' ').toLowerCase())) return 'contaminated';
  const v = String(site.Status || '').toLowerCase().trim();
  if (!v) return 'unknown';
  const head = v.split(/[\s(;,:]/)[0];
  if (RX_ACTIVE.test(head)) return 'active';
  if (RX_OLD.test(head)) return 'old';
  if (RX_FUTURE.test(head)) return 'future';
  if (/still receiv/.test(v)) return 'active';
  if (RX_FUTURE.test(v)) return 'future';
  if (RX_OLD.test(v)) return 'old';
  if (RX_ACTIVE.test(v)) return 'active';
  return 'unknown';
}
const COL = {
  facility: { active: '#FF0000', future: '#0000FF', old: '#FFD400', contaminated: '#B300FF', unknown: '#FFFFFF' },
  project:  { active: '#00FF00', future: '#95FF00', old: '#00B218', unknown: '#FFFFFF', contaminated: '#00FF00' }
};
const colourOf = s => COL[s.__cat][s.__cls] || '#FFFFFF';
const STATUS_WORD = {
  facility: { active: ['receiving now', 'mottar nå'], future: ['planned', 'planlagt'], old: ['closed', 'nedlagt'], contaminated: ['contaminated', 'forurenset'], unknown: ['no status', 'ukjent'] },
  project:  { active: ['under way', 'pågår'], future: ['planned', 'planlagt'], old: ['finished', 'ferdig'], unknown: ['no status', 'ukjent'], contaminated: ['under way', 'pågår'] }
};
function actsOf(s) {
  const a = String(s.Activities || '').toLowerCase();
  if (a.trim()) return { rec: /recep|mottak/.test(a), ext: /extract|uttak/.test(a) };
  const ty = (String(s.Type || '') + ' ' + String(s.Subtype || '')).toLowerCase();
  return { rec: true, ext: /pukkverk|grustak|massetak|steinbrudd/.test(ty) || !!String(s.ExtractionAnnual || s.ExtractionTotal || '').trim() };
}
function direction(s) {
  if (s.__cat === 'project') {
    const sr = String(s['source /reception'] || s['source/reception'] || '').toLowerCase();
    if (sr.includes('source') && sr.includes('reception')) return 'mixed';
    if (sr.includes('source') || sr.includes('produc')) return 'producing';
    if (sr.includes('reception') || sr.includes('receiv')) return 'receiving';
    return 'mixed';
  }
  const ty = String(s.Type || '').toLowerCase();
  if (ty.includes('pukkverk')) return 'producing';
  if (ty.includes('deponi') || ty.includes('massemottak')) return 'receiving';
  return 'mixed';
}
function symbol(s, size) {
  const z = size || 13, c0 = colourOf(s), c = c0 === '#FFFFFF' ? '#4A4A4A' : c0, d = direction(s);
  if (s.__cat === 'project') {
    const f = d === 'producing' ? '<polygon points="1,15 15,15 1,1" fill="#000"/>' : d === 'receiving' ? '<polygon points="15,1 15,15 1,1" fill="#000"/>'
            : '<polygon points="1,1 8,8 1,15" fill="#000"/><polygon points="15,1 8,8 15,15" fill="#000"/>';

    ${r('f_class', term('cls', d.Class))}${r('f_date', esc(d.Date))}${r('f_sites', sites)}${r('f_kommune', kom || esc(d.Kommune))}
    ${r('f_archive', d.__arch ? term('arch', d.__arch) : '')}${r('f_creator', esc(d.Creator))}${r('f_licence', esc(d.Licence))}
    ${r('f_access', acc)}${r('f_note', esc(d.Note))}${r('f_id', `<span class="mono">${esc(d.DocID)}</span>`)}
    ${link ? `<a class="go u" href="${esc(link)}" target="_blank" rel="noopener noreferrer">↗ ${t('open')}</a>` : ''}
    ${d.__sites[0] ? `<a class="go u" href="${esc(MAP_LINK + encodeURIComponent(uidOf(d.__sites[0])))}" target="_top">${t('map')} →</a>` : ''}
    ${nav}</div></article>`;
}

// ─────────────────────────────────────────────────────────────────────────
// Render
// ─────────────────────────────────────────────────────────────────────────
function chips() {
  const ks = Object.keys(state.f);
  if (!ks.length) { $('a-chips').innerHTML = ''; return; }
  const n = chosen().length;
  $('a-chips').innerHTML = ks.map(k => `<button class="chip" data-drop="${k}">${esc(FACETS[k].word(state.f[k]))}<b>×</b></button>`).join('') +
    `<span class="a-count">${n} ${t(n === 1 ? 'doc1' : 'docs')}</span>` + (ks.length > 1 ? `<button class="a-clear" data-clear>${t('clear')}</button>` : '');
}
function render() {
  document.documentElement.lang = NO() ? 'no' : 'en';
  document.querySelectorAll('[data-en]').forEach(el => { el.textContent = el.getAttribute('data-' + lang) || el.getAttribute('data-en'); });
  document.querySelectorAll('#a-lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  document.querySelectorAll('#a-nav .nv').forEach(b => b.classList.toggle('on', b.dataset.go === state.v));
  const nSites = new Set(DOCS.flatMap(d => d.__sites.map(uidOf))).size;
  $('a-tally').textContent = `${DOCS.length} ${t('docs')} · ${nSites} ${t('sitesN')}`;
  chips();
  const v = { terms: viewTerms, sites: viewSites, kommuner: viewKommuner, colour: viewColour, picto: viewPicto, doc: viewDoc }[state.v] || viewTerms;
  $('a-view').innerHTML = v();
  const d = state.v === 'doc' ? BYID[state.doc] : null;
  document.title = (d ? d.Title + ' · ' : '') + (NO() ? 'Register' : 'Index') + ' · Dirty Business';
}

document.addEventListener('click', e => {
  const el = e.target.closest('button,a,path');
  if (!el || document.documentElement.classList.contains('dbx-sel') || document.documentElement.classList.contains('dbx-txt')) return;
  if (el.dataset.go) { go({ v: el.dataset.go, f: state.f }); return; }
  if (el.dataset.lang) { lang = el.dataset.lang; try { localStorage.setItem('db-sites-lang', lang); } catch (x) {} render(); return; }
  if (el.dataset.drop) { const f = Object.assign({}, state.f); delete f[el.dataset.drop]; go({ v: state.v === 'doc' ? 'terms' : state.v, f }); return; }
  if (el.hasAttribute('data-clear')) { go({ v: state.v === 'doc' ? 'terms' : state.v, f: {} }); return; }
  if (el.hasAttribute('data-back')) { go({ v: 'terms', f: state.f }); return; }
  if (el.dataset.more) { openMore[el.dataset.more] = !openMore[el.dataset.more]; render(); return; }
  if (el.dataset.k && !el.disabled) {
    const f = Object.assign({}, state.f), k = el.dataset.k, v = el.dataset.val;
    if (f[k] === v && state.v !== 'doc') delete f[k]; else f[k] = v;
    if (el.dataset.fam) f.fam = el.dataset.fam;
    go({ v: state.v === 'kommuner' && k === 'k' ? 'kommuner' : 'terms', f }); return;
  }
  if (el.tagName === 'path' && el.classList.contains('has')) {
    const f = Object.assign({}, state.f);
    if (f.k === el.dataset.nr) delete f.k; else f.k = el.dataset.nr;
    go({ v: 'kommuner', f }, true); return;
  }
  if (el.dataset.doc) { e.preventDefault(); go({ v: 'doc', doc: el.dataset.doc, f: state.f }); }
});
document.addEventListener('mousemove', e => {
  const tip = $('a-ktip');
  const p = e.target.closest && e.target.closest('#a-kmap path');
  if (!p) { tip.style.display = 'none'; return; }
  const n = DOCS.filter(d => d.__k.includes(p.dataset.nr)).length;
  tip.textContent = p.dataset.n + (n ? ' · ' + n : '');
  tip.style.display = 'block'; tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
});

Promise.all([parseCsv(FACILITIES_CSV), parseCsv(PROJECTS_CSV), parseCsv(DOCUMENTS_CSV), getJson(KOMMUNER)])
  .then(([f, p, d, kom]) => {
    prepare(f.data || [], p.data || [], d.data || [], kom);
    if (!DOCS.length) throw new Error('empty');
    state = readHash();
    render();
  })
  .catch(err => { console.error(err); $('a-view').innerHTML = `<p class="a-msg">${t('loadfail')}</p>`; });
})();
</script>
</body>
</html>
