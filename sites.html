<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Index · Dirty Business</title>
<meta name="description" content="The index of every document Dirty Business holds on the reception sites, quarries and construction projects of the Oslo region: photographs, aerials, newspaper articles, permits and reports, by class, site, kommune, period and archive.">
<meta property="og:title" content="Dirty Business — index of documents">
<meta property="og:description" content="Photographs, permits, plans, newspaper articles and registers on the Oslo region's excavated masses, arranged by site, class, decade, kommune, type of site and archive, and placed on a map.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&display=swap" rel="stylesheet">
<style>
:root{--water:#00FFFF;--tie:#FF0000;--ink:#000;--sub:#808080;--red:#FF0000;--frame:#bdbdbd;--cell:180px;--obj:164px;--nav:170px;--pad:20px;--gap:24px}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);height:100%}
body{font:12px/17px 'Cutive Mono','Courier New',monospace;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left;border-radius:0}
/* Three panes side by side: the terms, the documents, and (when one is open) the reading table.
   Each scrolls on its own, so choosing a document never moves the others. */
#atlas{height:100vh;height:100svh;padding:var(--pad) var(--pad) 0;display:flex;align-items:stretch;gap:var(--gap)}
#a-nav,#a-main,#a-read{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--frame) transparent}
#a-nav{flex:0 0 var(--nav);min-width:0;display:flex;flex-direction:column;padding-bottom:56px}
#a-q{flex:0 0 auto;width:100%;height:22px;padding:0 6px;border:1px solid var(--ink);border-radius:0;outline:none;background:#fff;font:inherit;color:var(--ink);margin-bottom:16px;-webkit-appearance:none;appearance:none}
#a-q::-webkit-search-cancel-button{display:none}
.cat{display:block;line-height:19px;color:var(--sub)}
.head{display:block;line-height:19px;color:var(--ink);margin:0 0 4px}
.head.gap{margin-top:18px}
.cats{display:flex;flex-direction:column;padding-left:12px}
.inv{display:block;line-height:17px;color:var(--sub);padding-left:12px}
.inv.on,.inv:hover,.head:hover{color:var(--ink)}
.cat.on,.cat:hover,.top:hover,.top.on,.sub:hover,.sub.on,.sec-t:hover,.sub-t:hover,.tm button:hover,#a-mix button:hover,#a-lang button:hover,.rd-bar button:hover{color:var(--ink)}
.cat.gap,#a-mix{margin-top:14px}
.tops{display:flex;flex-direction:column;padding:0 0 8px 12px}
.top{line-height:17px;color:var(--sub)}
.subs{display:flex;flex-direction:column;padding:0 0 4px 12px}
.sub{line-height:16px;font-size:11px;color:var(--sub)}
#a-mix{display:flex;gap:10px;color:var(--sub)}
#a-mix button{color:var(--sub)}
#a-main{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:28px;padding-bottom:40px}
#a-main.map{overflow:hidden;padding-bottom:var(--pad)}
.sec{display:flex;flex-direction:column;gap:14px}
.ssec{display:flex;flex-direction:column;gap:10px}
.sec-t,.sub-t{align-self:flex-start;animation:fade .5s ease .25s both}
.sub-t{color:var(--sub);font-size:11px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cell),1fr));gap:22px 14px}
.obj{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);min-width:0;transition:opacity .25s}
.obj.dim,.pin.dim{opacity:.1}
.obj .im{display:flex;align-items:center;justify-content:center;width:var(--obj);max-width:100%;height:calc(var(--obj) * .8)}
.obj .im img{display:block;max-width:100%;max-height:100%}
.obj .im.no{border:1px solid var(--frame)}
/* first pages of permits and reports: a hairline round the sheet */
img.pg{box-shadow:0 0 0 .5px var(--ink)}
.obj .lb{max-width:100%;padding:0 3px;text-align:center;overflow-wrap:anywhere;font-size:10px;line-height:13px;color:var(--sub)}
.obj:hover .lb,.obj.cur .lb{color:var(--ink)}
/* The reading table */
#a-read{flex:0 0 0;width:0;display:none;padding-bottom:40px}
body.reading #a-read{display:block;flex-basis:calc((100vw - var(--nav) - 2 * var(--pad) - 2 * var(--gap)) * .5)}
.rd{display:grid;grid-template-columns:minmax(150px,210px) 1fr;grid-template-rows:auto 1fr;column-gap:18px;align-items:start}
.rd .meta{display:flex;flex-direction:column;align-items:flex-start;gap:8px;font-size:11px;line-height:15px;min-width:0}
.rd .meta>*{max-width:100%;overflow-wrap:anywhere}
.rd .meta .tm span{white-space:normal}
.rd-bar{grid-column:1/-1}
.rd-bar{align-self:stretch;display:flex;gap:16px;color:var(--sub);position:sticky;top:0;background:#fff;padding-bottom:6px;z-index:1}
.rd-bar button{color:var(--sub)}
.rd-bar .sp{flex:1}
.rd .tt{max-width:620px}
.rd .by{max-width:620px;color:var(--sub);margin-top:-6px}
.rd .by a{color:inherit;text-decoration:none}
.rd .tm{max-width:620px;color:var(--sub)}
.rd .tm span{white-space:nowrap}
.rd .tm button{white-space:normal;color:var(--sub)}
.rd .tm button.k{color:var(--red)}
.rd .tm button.on{color:var(--ink)}
.rd .ln{display:flex;flex-wrap:wrap;column-gap:16px}
.rd .ln .note{color:var(--sub)}
/* the picture fits the height of the screen; a click shows it at full width */
.rd .pic{display:block;max-width:100%;justify-self:start;cursor:zoom-in}
.rd .pic img{display:block;max-width:100%;height:auto;max-height:calc(100vh - var(--pad) - 60px)}
.rd.full .pic{cursor:zoom-out}
.rd.full .pic img{max-height:none}
.rd .pic .no{display:flex;align-items:center;justify-content:center;width:min(480px,100%);aspect-ratio:4/3;border:1px solid var(--frame)}
/* The map: white ground, kommune boundaries as hairlines, every document at its place */
#a-map{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;cursor:grab;touch-action:none}
#a-map.drag{cursor:grabbing}
#a-map svg{position:absolute;inset:0;width:100%;height:100%}
#a-map .wl{position:absolute;left:0;top:0;max-width:none;pointer-events:none;user-select:none;transform-origin:0 0}
#a-map .wl.ct{opacity:.35;filter:grayscale(1)}
#a-map .wl.bd{opacity:.45;filter:grayscale(1)}
#a-map .wl.wa,#a-map .wl.co{background:var(--water);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
#a-map .wl.wa{opacity:.1}
#a-map .wl.co{opacity:.45}
#a-cred{position:absolute;left:0;bottom:0;background:#fff;padding:2px 6px 0 0;color:var(--sub);font-size:10px}
/* on the map each document is a small black A4 sheet; pointing at it shows its picture */
.pin{position:absolute;display:block;background:var(--ink);transition:opacity .25s}
#a-peek{position:absolute;z-index:3;pointer-events:none;display:none;background:#fff}
#a-peek img{display:block;max-width:150px;max-height:200px}
#a-peek .no{display:flex;align-items:center;justify-content:center;width:106px;height:150px;border:1px solid var(--frame)}
/* connections: hairlines from the opened document to the ones it is tied to; highlights as a yellow marker */
#a-links{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:4}
#a-links line,.board svg line{stroke:var(--tie);stroke-width:.35}
#a-links circle,.board svg circle{fill:var(--tie)}
.rd .pic{position:relative}
.rd .hl{position:absolute;box-shadow:inset 0 0 0 1px var(--tie)}
.rd .cx{display:flex;flex-direction:column;align-items:flex-start;color:var(--sub);max-width:620px}
.rd .cx button{color:var(--ink);text-align:left}
.obj.tie .lb{color:var(--ink)}
/* an investigation: cut-out passages and documents by year, joined by straight lines in pure red,
   each join carrying a flat yellow note */
.board{position:relative;min-height:70vh;margin-top:8px}
.board svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:3}
.board .col{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-start;gap:30px;flex:0 0 auto}
.board .yr{color:var(--sub);font-size:11px}
.pc{position:absolute;z-index:1;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);cursor:grab;touch-action:none;user-select:none}
.pc.drag{cursor:grabbing;z-index:2}
.pc img{-webkit-user-drag:none;user-select:none}
.pc .wh{position:relative;display:block;width:150px;background:#fff;box-shadow:0 0 0 1px var(--ink)}
.pc .wh img{display:block;width:100%;height:auto}
.pc .wh.no{display:flex;align-items:center;justify-content:center;width:96px;height:120px}
.pc .mk{position:absolute;box-shadow:inset 0 0 0 .75px var(--tie)}
.pc .id{font-size:9px;line-height:11px;color:var(--sub)}
.post{position:absolute;z-index:4;width:72px;height:72px;overflow:hidden;background:#FFFF00;color:#333;font-size:9px;line-height:11px;padding:6px;pointer-events:none;-webkit-font-smoothing:antialiased}
.pin.cur{outline:1px solid var(--ink);outline-offset:2px;z-index:2}
#a-zoom{position:absolute;right:0;bottom:0;display:flex;gap:10px;background:#fff;padding:2px 0 0 6px;color:var(--sub)}
#a-zoom button:hover{color:var(--ink)}
#a-lang{position:fixed;left:var(--pad);bottom:14px;background:#fff;color:var(--sub);padding-top:4px;z-index:5}
#a-lang button{color:var(--sub)}
#a-lang button.on{color:var(--ink)}
.a-msg{color:var(--sub);margin:0}
.framed #atlas{padding-top:6px;height:calc(100vh - 34px)}
.framed #a-lang{bottom:40px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sec-t,.sub-t{animation:none}.obj{transition:none}}
/* Phones: one column of panes; the reading table covers the page */
@media (max-width:760px){
  body{overflow:auto}
  #atlas{display:block;height:auto;padding:12px}
  #a-nav,#a-main{overflow:visible}
  #a-nav{padding-bottom:16px}
  :root{--cell:132px;--obj:120px}
  #a-main.map{height:75svh}
  body.reading{overflow:hidden}
  body.reading #a-read{position:fixed;inset:0;z-index:6;background:#fff;padding:12px 12px 40px;width:auto}
  .rd{grid-template-columns:1fr}
}
</style>
</head>
<body>

const ICON = {

  page: 'M8 3h11l5 5v21H8z M19 3v5h5 M11 13h10 M11 17h10 M11 21h7',

const KIND = { 'Photograph': 'photo', 'Aerial photograph': 'photo', 'Newspaper article': 'press' };

// ─────────────────────────────────────────────────────────────────────────
// Helpers

document.addEventListener('click', e => {
  const zp = e.target.closest && e.target.closest('[data-zoom-pic]');
  if (zp && !e.target.closest('.hl')) { zp.closest('.rd').classList.toggle('full'); linksFor(400); return; }
  const el = e.target.closest('button,a');
  if (!el || document.documentElement.classList.contains('dbx-sel') || document.documentElement.classList.contains('dbx-txt')) return;
  if (el.dataset.lang) { LANG = el.dataset.lang; try { localStorage.setItem('db-index-lang', LANG); } catch (er) {} renderMain(); renderRead(); writeHash(); return; }
  if (el.dataset.zoom) { zoomAt(+el.dataset.zoom); return; }
  if (el.hasAttribute('data-home')) { arrange({ by: '', g: '', s: '' }, true); return; }
  if (el.hasAttribute('data-inv-head')) { const first = Object.keys(CASES)[0]; if (first) arrange({ by: 'inv', g: first, s: '' }, true); return; }
  if (el.dataset.inv) { arrange({ by: 'inv', g: el.dataset.inv, s: '' }, true); return; }
  if (el.hasAttribute('data-mix')) { arrange({ mix: String(1 + Math.floor(Math.random() * 9999)) }); return; }
  if (el.hasAttribute('data-unmix')) { arrange({ mix: '' }); return; }
  if (el.dataset.by) {
    const off = state.by === el.dataset.by;
    if (el.dataset.by === 'map' || state.by === 'map') { VIEW = { k: 1, cx: null, cy: null }; BASE = null; }
    arrange({ by: off ? '' : el.dataset.by, g: '', s: '' }, true); return;
  }
  if (el.dataset.s != null) { arrange({ g: el.dataset.g, s: state.s === el.dataset.s ? '' : el.dataset.s }, true); return; }
  if (el.dataset.g != null) { arrange({ g: state.g === el.dataset.g && !state.s ? '' : el.dataset.g, s: '' }, true); return; }
  if (el.dataset.term) {
    const c = el.dataset.term, v = el.dataset.val, on = state.by === c && state.s === v;
    arrange(on ? { by: c, g: '', s: '' } : { by: c, g: topOf(c, v), s: v }, true); return;
  }
  if (el.dataset.step) { step(+el.dataset.step); return; }
  if (el.hasAttribute('data-close')) { read(''); return; }
  if (el.dataset.doc) { e.preventDefault(); read(state.doc === el.dataset.doc ? '' : el.dataset.doc); }
});
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (!state.doc) return;
  if (e.key === 'Escape') read('');
  else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
});
// A picture that cannot be fetched gives way to the line icon of its kind.
document.addEventListener('error', e => {
  const img = e.target;
  if (!img || img.tagName !== 'IMG') return;
  const box = img.closest('[data-id],[data-rd]'), d = box && BYID[box.dataset.id || box.dataset.rd];
  if (!d) return;
  if (box.dataset.rd) img.outerHTML = `<span class="no">${svgIcon(d.__icon, 32, .8)}</span>`;
  else { img.parentNode.classList.add('no'); img.outerHTML = svgIcon(d.__icon, 22, 1); }
}, true);
$('a-q').addEventListener('input', e => { state.q = e.target.value; search(); writeHash(); });
window.addEventListener('hashchange', () => {
  const o = readHash();
  if (KEYS.some(k => o[k] !== state[k])) { const docOnly = KEYS.every(k => k === 'doc' || o[k] === state[k]); if (docOnly) read(o.doc); else { state = o; $('a-q').value = state.q; renderMain(); renderRead(); } }
});

$('a-main').innerHTML = `<p class="a-msg">${esc(w('loading'))}</p>`;
Promise.all([parseCsv(FACILITIES_CSV), parseCsv(PROJECTS_CSV), parseCsv(DOCUMENTS_CSV), getJson(KOMMUNER), getJson(THUMBS), getJson(AUTHORS), getJson(LINKS), getJson(RELATIONS), getJson(THEMES)])
  .then(([f, p, d, kom, th, au, ln, rel, thm]) => {
    prepare(f.data || [], p.data || [], d.data || [], kom, th, au, ln, rel, thm);
    if (!DOCS.length) throw new Error('empty');
    state = readHash();
    $('a-q').value = state.q;
    renderMain();
    renderRead();
    if (state.doc) { const o = document.querySelector('#a-main .cur'); if (o && !$('a-main').classList.contains('map')) o.scrollIntoView({ block: 'center' }); }
  })
  .catch(err => { console.error(err); $('a-main').innerHTML = `<p class="a-msg">${esc(w('fail'))}</p>`; });
})();
</script>
<script src="assets/scan-dot.js?v=3"></script>
